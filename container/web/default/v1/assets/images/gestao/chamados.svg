<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="t">
  <title id="t">Ilustração Connect: chamado aberto no celular e a manutenção do condomínio acompanhada</title>
  <defs>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#072617" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="420" height="250" fill="#F1E6BF"/>
  <circle cx="330" cy="70" r="90" fill="#E9D9A4"/>
  <circle cx="40" cy="230" r="70" fill="#EADFB5"/>
  <g fill="#072617" opacity=".18">
    <circle cx="372" cy="210" r="2"/><circle cx="388" cy="210" r="2"/><circle cx="372" cy="226" r="2"/><circle cx="388" cy="226" r="2"/>
  </g>

  <!-- prancheta com a lista da manutenção -->
  <g transform="rotate(-5 300 140)">
    <g filter="url(#sh)"><rect x="236" y="56" width="132" height="164" rx="12" fill="#FFFFFF"/></g>
    <rect x="276" y="46" width="52" height="20" rx="6" fill="#072617"/>
    <circle cx="302" cy="52" r="4" fill="#C5A131"/>
    <g stroke-linecap="round" stroke-linejoin="round">
      <rect x="254" y="86" width="16" height="16" rx="4" fill="#2C5A42"/>
      <path d="M258 94 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <rect x="278" y="90" width="70" height="8" rx="4" fill="#D8D2C0"/>
      <rect x="254" y="116" width="16" height="16" rx="4" fill="#2C5A42"/>
      <path d="M258 124 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <rect x="278" y="120" width="56" height="8" rx="4" fill="#D8D2C0"/>
      <rect x="254" y="146" width="16" height="16" rx="4" fill="#C5A131"/>
      <path d="M258 154 l3 3 l6 -7" fill="none" stroke="#072617" stroke-width="2.2"/>
      <rect x="278" y="150" width="64" height="8" rx="4" fill="#D8D2C0"/>
      <rect x="254" y="176" width="16" height="16" rx="4" fill="none" stroke="#2C5A42" stroke-width="2"/>
      <rect x="278" y="180" width="48" height="8" rx="4" fill="#EDE8DA"/>
    </g>
  </g>

  <!-- chave de manutenção -->
  <g transform="translate(366 192) rotate(-45)">
    <rect x="-5.5" y="-4" width="11" height="52" rx="5.5" fill="#072617"/>
    <path d="M-16 -22 a16 16 0 0 0 32 0 a16 16 0 0 0 -6 -12.5 v11 h-20 v-11 a16 16 0 0 0 -6 12.5z" fill="#072617"/>
  </g>

  <!-- celular com o chamado -->
  <g filter="url(#sh)"><rect x="70" y="22" width="122" height="214" rx="20" fill="#072617"/></g>
  <rect x="78" y="32" width="106" height="194" rx="14" fill="#F5F2E9"/>
  <rect x="112" y="38" width="38" height="6" rx="3" fill="#072617"/>
  <!-- topo do app -->
  <rect x="78" y="50" width="106" height="26" fill="#072617"/>
  <circle cx="94" cy="63" r="6" fill="#C5A131"/>
  <rect x="106" y="59" width="52" height="7" rx="3.5" fill="#F5F2E9" opacity=".9"/>
  <!-- mensagens -->
  <rect x="88" y="88" width="72" height="26" rx="9" fill="#FFFFFF"/>
  <rect x="96" y="96" width="50" height="5" rx="2.5" fill="#2C5A42" opacity=".6"/>
  <rect x="96" y="104" width="34" height="5" rx="2.5" fill="#2C5A42" opacity=".35"/>
  <rect x="104" y="124" width="72" height="34" rx="9" fill="#2C5A42"/>
  <rect x="112" y="132" width="52" height="5" rx="2.5" fill="#F5F2E9" opacity=".85"/>
  <rect x="112" y="140" width="40" height="5" rx="2.5" fill="#F5F2E9" opacity=".6"/>
  <rect x="112" y="148" width="28" height="5" rx="2.5" fill="#C5A131"/>
  <rect x="88" y="168" width="60" height="20" rx="9" fill="#FFFFFF"/>
  <rect x="96" y="175" width="40" height="5" rx="2.5" fill="#2C5A42" opacity=".6"/>
  <!-- status resolvido -->
  <rect x="88" y="198" width="86" height="18" rx="9" fill="#C5A131"/>
  <circle cx="99" cy="207" r="5" fill="#072617"/>
  <path d="M96.5 207 l2 2 l3.5 -4" fill="none" stroke="#C5A131" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="109" y="204" width="54" height="6" rx="3" fill="#072617" opacity=".75"/>

  <!-- notificação -->
  <g transform="translate(176 60)">
    <circle r="15" fill="#C5A131" stroke="#F1E6BF" stroke-width="4"/>
    <path d="M-5 3 v-4 a5 5 0 0 1 10 0 v4 l2 2 h-14z" fill="#072617"/>
    <circle cy="8" r="2" fill="#072617"/>
  </g>
</svg>
