<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="t">
  <title id="t">Ilustração Connect: prédios do condomínio e o painel de prestação de contas</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="1" stop-color="#F1EBDA"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#072617" flood-opacity=".16"/>
    </filter>
    <pattern id="win" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="12" height="11" rx="2" fill="#0F3D27"/>
    </pattern>
    <pattern id="winb" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="10" height="10" rx="2" fill="#1A4A33"/>
    </pattern>
  </defs>
  <rect width="840" height="300" fill="url(#sky)"/>
  <!-- sol e malha de pontos -->
  <circle cx="300" cy="96" r="64" fill="#E9D9A4" opacity=".55"/>
  <g fill="#C5A131" opacity=".35">
    <circle cx="40" cy="40" r="2.2"/><circle cx="58" cy="40" r="2.2"/><circle cx="76" cy="40" r="2.2"/>
    <circle cx="40" cy="58" r="2.2"/><circle cx="58" cy="58" r="2.2"/><circle cx="76" cy="58" r="2.2"/>
    <circle cx="40" cy="76" r="2.2"/><circle cx="58" cy="76" r="2.2"/><circle cx="76" cy="76" r="2.2"/>
    <circle cx="788" cy="232" r="2.2"/><circle cx="806" cy="232" r="2.2"/><circle cx="788" cy="250" r="2.2"/><circle cx="806" cy="250" r="2.2"/>
  </g>
  <!-- chão -->
  <rect x="0" y="262" width="840" height="38" fill="#E4DBC2"/>
  <rect x="0" y="258" width="840" height="6" fill="#D7CBA8"/>

  <!-- prédio do fundo -->
  <rect x="118" y="92" width="96" height="170" rx="4" fill="#2C5A42"/>
  <rect x="126" y="102" width="80" height="150" fill="url(#winb)" opacity=".9"/>
  <!-- torre principal -->
  <rect x="180" y="52" width="132" height="210" rx="5" fill="#072617"/>
  <rect x="172" y="44" width="148" height="14" rx="4" fill="#0F3D27"/>
  <rect x="192" y="70" width="110" height="154" fill="url(#win)"/>
  <!-- janelas acesas -->
  <g fill="#C5A131">
    <rect x="197" y="76" width="12" height="11" rx="2"/>
    <rect x="263" y="98" width="12" height="11" rx="2"/>
    <rect x="219" y="142" width="12" height="11" rx="2"/>
    <rect x="285" y="164" width="12" height="11" rx="2"/>
    <rect x="241" y="186" width="12" height="11" rx="2"/>
    <rect x="197" y="208" width="12" height="11" rx="2"/>
  </g>
  <g fill="#E9D9A4">
    <rect x="131" y="127" width="10" height="10" rx="2"/>
    <rect x="171" y="167" width="10" height="10" rx="2" opacity="0"/>
    <rect x="151" y="187" width="10" height="10" rx="2"/>
  </g>
  <!-- portaria -->
  <rect x="226" y="228" width="40" height="34" rx="3" fill="#C5A131"/>
  <rect x="244" y="232" width="2" height="30" fill="#072617" opacity=".5"/>
  <rect x="214" y="222" width="64" height="8" rx="3" fill="#0F3D27"/>
  <!-- prédio menor à direita -->
  <rect x="322" y="136" width="84" height="126" rx="4" fill="#1A4A33"/>
  <rect x="330" y="146" width="68" height="104" fill="url(#winb)"/>
  <rect x="345" y="166" width="10" height="10" rx="2" fill="#C5A131"/>
  <rect x="365" y="206" width="10" height="10" rx="2" fill="#C5A131"/>
  <!-- árvores -->
  <g>
    <rect x="96" y="226" width="5" height="36" fill="#5B4A1F"/>
    <circle cx="98.5" cy="220" r="20" fill="#3F7A55"/>
    <circle cx="88" cy="232" r="13" fill="#2C6646"/>
    <rect x="424" y="232" width="5" height="30" fill="#5B4A1F"/>
    <circle cx="426.5" cy="226" r="17" fill="#3F7A55"/>
    <circle cx="437" cy="236" r="11" fill="#2C6646"/>
  </g>

  <!-- linha pontilhada ligando o prédio ao painel -->
  <path d="M312 120 C 380 80, 430 70, 486 86" fill="none" stroke="#C5A131" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>
  <circle cx="312" cy="120" r="5" fill="#C5A131"/>

  <!-- painel de prestação de contas -->
  <g filter="url(#sh)">
    <rect x="486" y="40" width="300" height="196" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="486" y="40" width="300" height="40" rx="16" fill="#072617"/>
  <rect x="486" y="64" width="300" height="16" fill="#072617"/>
  <circle cx="508" cy="60" r="7" fill="#C5A131"/>
  <rect x="524" y="55" width="92" height="9" rx="4.5" fill="#F5F2E9" opacity=".9"/>
  <rect x="726" y="55" width="42" height="9" rx="4.5" fill="#C5A131" opacity=".85"/>
  <!-- resumo -->
  <rect x="506" y="96" width="78" height="8" rx="4" fill="#D8D2C0"/>
  <rect x="506" y="112" width="112" height="14" rx="5" fill="#072617"/>
  <rect x="640" y="96" width="60" height="8" rx="4" fill="#D8D2C0"/>
  <rect x="640" y="112" width="86" height="14" rx="5" fill="#C5A131"/>
  <!-- gráfico de barras -->
  <line x1="506" y1="214" x2="766" y2="214" stroke="#E6E0CF" stroke-width="2"/>
  <line x1="506" y1="184" x2="766" y2="184" stroke="#F0EBDD" stroke-width="1.5"/>
  <line x1="506" y1="154" x2="766" y2="154" stroke="#F0EBDD" stroke-width="1.5"/>
  <g>
    <rect x="514" y="176" width="20" height="38" rx="4" fill="#2C5A42"/>
    <rect x="538" y="186" width="20" height="28" rx="4" fill="#C5A131"/>
    <rect x="574" y="164" width="20" height="50" rx="4" fill="#2C5A42"/>
    <rect x="598" y="180" width="20" height="34" rx="4" fill="#C5A131"/>
    <rect x="634" y="158" width="20" height="56" rx="4" fill="#2C5A42"/>
    <rect x="658" y="176" width="20" height="38" rx="4" fill="#C5A131"/>
    <rect x="694" y="150" width="20" height="64" rx="4" fill="#072617"/>
    <rect x="718" y="172" width="20" height="42" rx="4" fill="#C5A131"/>
  </g>
  <path d="M524 170 L584 158 L644 150 L704 140 L752 132" fill="none" stroke="#C5A131" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="752" cy="132" r="5" fill="#FFFFFF" stroke="#C5A131" stroke-width="2.5"/>

  <!-- selo conferido -->
  <g transform="translate(770 216)">
    <circle r="26" fill="#C5A131"/>
    <circle r="26" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M-11 0 L-3 8 L12 -8" fill="none" stroke="#072617" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- boleto -->
  <g transform="translate(424 194) rotate(-6)">
    <g filter="url(#sh)"><rect width="128" height="70" rx="10" fill="#FFFDF7"/></g>
    <rect x="12" y="12" width="52" height="7" rx="3.5" fill="#2C5A42"/>
    <rect x="12" y="25" width="34" height="6" rx="3" fill="#D8D2C0"/>
    <rect x="84" y="11" width="32" height="20" rx="4" fill="#F1E6BF"/>
    <g fill="#072617">
      <rect x="12" y="42" width="2" height="18"/><rect x="17" y="42" width="4" height="18"/><rect x="24" y="42" width="2" height="18"/>
      <rect x="29" y="42" width="3" height="18"/><rect x="35" y="42" width="2" height="18"/><rect x="40" y="42" width="5" height="18"/>
      <rect x="48" y="42" width="2" height="18"/><rect x="53" y="42" width="3" height="18"/><rect x="59" y="42" width="2" height="18"/>
      <rect x="64" y="42" width="4" height="18"/><rect x="71" y="42" width="2" height="18"/><rect x="76" y="42" width="3" height="18"/>
      <rect x="82" y="42" width="2" height="18"/><rect x="87" y="42" width="5" height="18"/><rect x="95" y="42" width="2" height="18"/>
      <rect x="100" y="42" width="3" height="18"/><rect x="106" y="42" width="2" height="18"/><rect x="111" y="42" width="4" height="18"/>
    </g>
  </g>
</svg>
