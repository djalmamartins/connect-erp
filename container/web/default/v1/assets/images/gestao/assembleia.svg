<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-labelledby="t">
  <title id="t">Ilustração Connect: reunião de condôminos em volta da mesa, com a pauta e a votação</title>
  <defs>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#14452D"/>
      <stop offset="1" stop-color="#072617"/>
    </radialGradient>
  </defs>
  <rect width="420" height="250" fill="url(#glow)"/>
  <g fill="#C5A131" opacity=".25">
    <circle cx="24" cy="24" r="2"/><circle cx="40" cy="24" r="2"/><circle cx="56" cy="24" r="2"/>
    <circle cx="24" cy="40" r="2"/><circle cx="40" cy="40" r="2"/><circle cx="56" cy="40" r="2"/>
  </g>

  <!-- quadro com a pauta -->
  <rect x="150" y="26" width="120" height="78" rx="8" fill="#F5F2E9"/>
  <rect x="150" y="26" width="120" height="16" rx="8" fill="#C5A131"/>
  <rect x="150" y="34" width="120" height="8" fill="#C5A131"/>
  <rect x="164" y="54" width="10" height="10" rx="3" fill="#2C5A42"/>
  <path d="M166 59 l3 3 l5 -6" fill="none" stroke="#F5F2E9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="180" y="56" width="68" height="6" rx="3" fill="#2C5A42" opacity=".7"/>
  <rect x="164" y="72" width="10" height="10" rx="3" fill="#2C5A42"/>
  <path d="M166 77 l3 3 l5 -6" fill="none" stroke="#F5F2E9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="180" y="74" width="54" height="6" rx="3" fill="#2C5A42" opacity=".7"/>
  <rect x="164" y="88" width="10" height="10" rx="3" fill="none" stroke="#2C5A42" stroke-width="1.8"/>
  <rect x="180" y="90" width="62" height="6" rx="3" fill="#2C5A42" opacity=".35"/>
  <rect x="207" y="104" width="6" height="22" fill="#2C5A42"/>

  <!-- pessoas (fundo) -->
  <g>
    <circle cx="112" cy="118" r="15" fill="#E9D9A4"/>
    <path d="M84 170 q0 -36 28 -36 q28 0 28 36z" fill="#C5A131"/>
    <circle cx="308" cy="118" r="15" fill="#D8B98A"/>
    <path d="M280 170 q0 -36 28 -36 q28 0 28 36z" fill="#3F7A55"/>
    <!-- mão levantada (votação) -->
    <path d="M330 150 L346 104" stroke="#3F7A55" stroke-width="10" stroke-linecap="round"/>
    <circle cx="347" cy="99" r="7" fill="#D8B98A"/>
  </g>

  <!-- mesa -->
  <ellipse cx="210" cy="182" rx="168" ry="30" fill="#0F3D27"/>
  <ellipse cx="210" cy="176" rx="168" ry="30" fill="#2C5A42"/>
  <ellipse cx="210" cy="176" rx="150" ry="22" fill="#356B4E"/>
  <!-- papéis e xícara na mesa -->
  <g transform="rotate(-8 170 172)"><rect x="150" y="164" width="40" height="18" rx="3" fill="#F5F2E9"/><rect x="156" y="169" width="22" height="3" rx="1.5" fill="#2C5A42" opacity=".6"/><rect x="156" y="175" width="16" height="3" rx="1.5" fill="#2C5A42" opacity=".4"/></g>
  <g transform="rotate(6 250 170)"><rect x="232" y="162" width="40" height="18" rx="3" fill="#FFFFFF"/><rect x="238" y="167" width="24" height="3" rx="1.5" fill="#C5A131"/><rect x="238" y="173" width="18" height="3" rx="1.5" fill="#2C5A42" opacity=".4"/></g>
  <ellipse cx="300" cy="178" rx="9" ry="3.5" fill="#E9D9A4"/>
  <rect x="294" y="168" width="12" height="10" rx="3" fill="#F5F2E9"/>

  <!-- pessoas (frente, de costas) -->
  <g>
    <path d="M140 250 q0 -46 40 -46 q40 0 40 46z" fill="#F5F2E9"/>
    <circle cx="180" cy="196" r="17" fill="#5B4A1F"/>
    <path d="M226 250 q0 -42 36 -42 q36 0 36 42z" fill="#C5A131"/>
    <circle cx="262" cy="200" r="16" fill="#2E2414"/>
  </g>

  <!-- balão de fala com selo -->
  <g transform="translate(46 64)">
    <rect width="62" height="36" rx="10" fill="#C5A131"/>
    <path d="M40 36 l10 12 l0 -12z" fill="#C5A131"/>
    <circle cx="17" cy="18" r="4" fill="#072617"/><circle cx="31" cy="18" r="4" fill="#072617"/><circle cx="45" cy="18" r="4" fill="#072617"/>
  </g>
</svg>
