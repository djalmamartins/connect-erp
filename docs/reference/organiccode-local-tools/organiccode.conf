<VirtualHost *:80>
    ServerName www.organiccode.lab
    ServerAlias organiccode.lab app.organiccode.lab cms.organiccode.lab erp.organiccode.lab send.organiccode.lab
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName organiccode.lab
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/organiccode.pem
    SSLCertificateKeyFile /etc/apache2/certs/organiccode-key.pem
    Redirect permanent / https://www.organiccode.lab/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.organiccode.lab
    DocumentRoot /var/www/html/organiccode/public
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/organiccode.pem
    SSLCertificateKeyFile /etc/apache2/certs/organiccode-key.pem

    <Directory /var/www/html/organiccode/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/organiccode-web-error.log
    CustomLog ${APACHE_LOG_DIR}/organiccode-web-access.log combined
</VirtualHost>

