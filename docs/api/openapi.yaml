      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [action, note], properties: { action: { type: string, enum: [match, ignore] }, entry_id: { type: integer }, note: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Linha resolvida }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Linha já resolvida }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

