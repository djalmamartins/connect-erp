      responses:
        '200': { description: '{ data: { editable_roles, roles[{slug, name, level, editable, permissions[]}], permissions[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: setErpRolePermission
      summary: Liga ou desliga uma permissão erp.* de um papel; exige acesso a todos os condomínios (erp.permissions.manage, ADR 0168)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, permission, allowed]
              properties:
                role: { type: string, example: manager }
                permission: { type: string }
                allowed: { type: boolean }
      responses:
        '200': { description: '{ data: { role, permission, allowed, changed } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /patrimonial-entries:
    get:
      operationId: patrimonialEntries
      summary: Lançamentos patrimoniais (fundos e PL, contas 7/8/9) do período (erp.entries.view e erp.chart.view, ADR 0169)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 'No máximo 366 dias' }
      responses:
        '200': { description: '{ data: { condominium_id, from, to, truncated, rows[], totals{entries, amount_cents} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createPatrimonialEntry
      summary: Lança débito e crédito entre contas patrimoniais analíticas do mesmo condomínio (erp.entries.manage, ADR 0169)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominium_id, description, amount_cents, debit_account_id, credit_account_id]
              properties:
                condominium_id: { type: integer }
                entry_date: { type: string, format: date, description: 'Até hoje; padrão hoje' }
                description: { type: string, minLength: 3, maxLength: 255 }
                amount_cents: { description: 'Inteiro em centavos ou texto como "1.234,56"; positivo' }
                debit_account_id: { type: integer }
                credit_account_id: { type: integer }
                bank_account_id: { type: integer, nullable: true }
                linked_entry_id: { type: integer, nullable: true }
      responses:
        '201': { description: '{ data: linha como no GET }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /patrimonial-entries/{id}/reverse:
    post:
      operationId: reversePatrimonialEntry
      summary: Estorna um lançamento patrimonial com motivo (erp.entries.manage, ADR 0169)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
                date: { type: string, format: date, description: 'Padrão hoje; não antes do original' }
      responses:
        '200': { description: '{ data: { original, reversal } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Já estornado, é um estorno ou competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /investments/positions:
    get:
      operationId: investmentPositions
      summary: Saldo das aplicações e totais de corrente, poupança e aplicação na data (erp.entries.view e erp.chart.view, ADR 0170)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: '{ data: { condominium_id, as_of, accounts[], totals{checking_cents, savings_cents, investments_cents, total_cents} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/bank-ledger:
    get:
      operationId: bankLedger
      summary: Razão das contas bancárias com lançamentos e transferências dos dois lados (erp.entries.view e erp.chart.view, ADR 0170)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 'No máximo 366 dias' }
      responses:
        '200': { description: '{ data: { condominium_id, from, to, truncated, accounts[{lines[]}], totals } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /investments/{id}/link:
    post:
      operationId: linkInvestment
      summary: Liga (ou desliga com null) a aplicação a uma conta corrente do mesmo condomínio (erp.bank_accounts.manage, ADR 0170)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_bank_account_id: { type: integer, nullable: true }
      responses:
        '200': { description: '{ data: { id, condominium_id, name, kind, parent_bank_account_id } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /investments/{id}/apply:
    post:
      operationId: applyInvestment
      summary: Aplica da conta corrente na aplicação pela transferência entre contas, sem DRE (erp.entries.manage, ADR 0170)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: 'Conta de aplicação' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { description: 'Inteiro em centavos ou texto como "400,00"; positivo' }
                transferred_on: { type: string, format: date }
                description: { type: string }
      responses:
        '201': { description: '{ data: { direction, investment_account_id, checking_account_id, transfer } }' }
        '409': { description: 'Competência fechada' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /investments/{id}/redeem:
    post:
      operationId: redeemInvestment
      summary: Resgata da aplicação para a conta corrente pela transferência entre contas, sem DRE (erp.entries.manage, ADR 0170)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: 'Conta de aplicação' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents]
              properties:
                amount_cents: { description: 'Inteiro em centavos ou texto como "400,00"; positivo' }
                transferred_on: { type: string, format: date }
                description: { type: string }
      responses:
        '201': { description: '{ data: { direction, investment_account_id, checking_account_id, transfer } }' }
        '409': { description: 'Competência fechada' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /patrimonial-imports:
    post:
      operationId: previewPatrimonialImport
      summary: Prévia por linha de um CSV/XLSX de lançamentos patrimoniais; nada é lançado (erp.imports.manage e erp.entries.manage, ADR 0171)
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,80}$' } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [condominium_id, file]
              properties:
                condominium_id: { type: integer }
                file: { type: string, format: binary, description: 'CSV (; ou ,) ou XLSX, até 2 MB e 5000 linhas' }
                idempotency_key: { type: string }
      responses:
        '201': { description: '{ data: { id, status, rows_count, error_count, summary, preview[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Já aplicada ou a mesma chave com outro arquivo' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /patrimonial-imports/{id}:
    get:
      operationId: patrimonialImport
      summary: Importação patrimonial sem a prévia (erp.imports.view, ADR 0171)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { id, condominium_id, status, rows_count, error_count, summary } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /patrimonial-imports/{id}/apply:
    post:
      operationId: applyPatrimonialImport
      summary: Revalida e grava todas as linhas, tudo ou nada (erp.imports.manage e erp.entries.manage, ADR 0171)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { status: applied, summary{applied{entries, entry_ids}} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Linha com erro na revalidação (inclusive mês fechado), já aplicada ou arquivo diferente da prévia' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /reports/statement:
    get:
      operationId: financialStatement
      summary: Prestação de contas por caixa, com conciliação por conta bancária (erp.entries.view e erp.chart.view)
      description: >-
        accounts = recebido e pago no período por conta do plano; banks = saldo anterior, entradas,
        saídas e saldo final de cada conta bancária; totals.reconciled diz se o caixa pelo plano é
        igual ao caixa pelos bancos (difference_cents mostra a diferença, nunca é escondida).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 'No máximo 366 dias' }
      responses:
        '200': { description: '{ data: { accounts[], banks[], totals{received_cents, paid_cents, result_cents, bank_net_cents, difference_cents, reconciled} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /reports/operations-summary:
    get:
      operationId: operationsSummary
      summary: Resumo operacional do mês para o síndico (ocorrências, manutenções e reservas), somente leitura (erp.occurrences.view, erp.maintenances.view e erp.reservations.view, ADR 0210)
      description: >-
        Mês: ocorrências abertas por prioridade, manutenções previstas e feitas, reservas confirmadas e taxas por área.
        Hoje (o cadastro guarda a situação atual): ocorrências abertas por prioridade e idade (0-7, 8-30, 31+ dias),
        manutenções atrasadas (até 50, com truncated) e dos próximos 30 dias, reservas aguardando aprovação. Só
        contagens, serviços, nomes de área e taxas: nenhum assunto ou descrição de ocorrência, morador ou unidade.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: competence, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200': { description: '{ data: { condominium_id, competence, from, to, today, occurrences { opened_in_month { total, by_priority }, open_today { total, by_priority, by_age, running } }, maintenances { planned_in_month, done_in_month, next_30_days, overdue_today { total, truncated, items[{ service, frequency, planned_on, days_late }] } }, reservations { confirmed_in_month, fees_in_month_cents, by_area[{ area, confirmed, fees_cents }], pending_approval_today } } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/check-copy-review:
    get:
      operationId: checkCopyReview
      summary: Conferência das cópias de cheques com os lançamentos e a sequência do talão por conta, somente leitura (erp.check_copies.view e erp.entries.view, ADR 0214)
      description: >-
        Por conta bancária, os números que faltam entre o primeiro e o último cheque registrado (emitidos e cancelados
        preenchem a sequência). Por cheque, os problemas com o lançamento ligado (no_entry, entry_missing,
        entry_cancelled, not_expense, amount_mismatch, other_account, entry_unpaid, cancelled_but_paid). Não grava nem
        envia nada. Sem favorecido na resposta.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { condominium_id, checks, missing_numbers, accounts[{ bank_account_id, bank_account_name, checks, cancelled, issued_cents, first, last, missing_count, missing[] }], summary { problema: quantidade }, items[{ check_copy_id, bank_account_id, check_number, issued_on, amount_cents, status, entry_id, entry_amount_cents, issues[] }], truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/document-transit:
    get:
      operationId: documentTransit
      summary: Malotes e avisos de recebimento parados (aguardando recebimento, aguardando conferência, AR em trânsito), somente leitura (erp.pouches.view e erp.delivery_notices.view, ADR 0215)
      description: >-
        Dias desde o envio (ou o recebimento, para conferir) pela mesma conta dos atrasos; atrasado = mais dias que
        days. Conferidos, entregues e devolvidos ficam de fora. Não grava nem envia nada. Sem portador, conteúdo,
        destinatário, assunto nem código de rastreio.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Vazio = hoje' }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
      responses:
        '200': { description: '{ data: { condominium_id, as_of, days, summary { awaiting_receipt, awaiting_check, in_transit: { open, overdue } }, overdue, items[{ kind (pouch|notice), id, stage, sent_on, since, days, overdue, documents_count, unit_id }], truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/obligation-calendar:
    get:
      operationId: obligationCalendar
      summary: Calendário de vencimentos do condomínio (apólice, contrato, mandato do síndico e conselho, documentos e protocolos do checklist) em vencidos, 30, 60 e 90 dias, somente leitura (ADR 0218)
      description: >-
        Cada fonte só entra com a permissão de ver o cadastro dela (insurances = erp.insurances.view, contracts =
        erp.contracts.view, board = erp.board.view, checklist = erp.condominiums.view); as demais vêm em hidden_sources.
        O checklist usa a mesma situação da tela (OnboardingChecklist). Vencidos sempre entram; futuros até a janela.
        Sem nome, documento, e-mail ou telefone de membro do conselho, sem responsável nem observações. Não grava nem envia nada.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Vazio = hoje' }
        - { name: days, in: query, schema: { type: integer, enum: [30, 60, 90], default: 90 } }
      responses:
        '200': { description: '{ data: { condominium_id, as_of, days, sources[], hidden_sources[], summary { expired, 30, 60, 90 }, items[{ source, id, kind (policy_end|contract_end|term_end|document_expiry|protocol_deadline), label, date, days, bucket, supplier_id?, category?, protocol? }], truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/meter-reading-review:
    get:
      operationId: meterReadingReview
      summary: Conferência das leituras de consumo de um mês (sem leitura, pico, queda, zero, leitura que não continua da anterior), somente leitura (erp.meter_readings.view, ADR 0220)
      description: >-
        Por relógio ativo do condomínio. A média usa só os meses com leitura dos 12 anteriores e exige 3 meses; com
        histórico curto, average é null e nada é apontado por média. Pico = acima de factor × média; queda = abaixo da
        média ÷ factor. Não grava nem envia nada; a correção é pelo lançamento da leitura. Sem nome de morador.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: competence, in: query, required: true, schema: { type: string, example: '2026-11' } }
        - { name: factor, in: query, schema: { type: number, minimum: 1.5, maximum: 5, default: 2 } }
      responses:
        '200': { description: '{ data: { condominium_id, competence, factor, min_history, totals { meters, read, billed, short_history, missing }, summary { missing, sequence_break, zero, spike, drop }, items[{ meter_id, kind, number, unit_id, unit_label, consumption, billed, history_months, issues[], average, ratio }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/delinquency-by-location:
    get:
      operationId: delinquencyByLocation
      summary: Inadimplência agrupada por bloco ou andar, com taxa de unidades em atraso e faixas de atraso, sem identificar unidade ou morador, somente leitura (erp.agreements.view, ADR 0222)
      description: >-
        Mesmo cálculo do relatório de inadimplentes (Agreements::delinquency: contas vencidas em aberto e encargos
        sugeridos) e as mesmas faixas (Agreements::bucket). Bloco ou andar vazio = "Sem bloco"/"Sem andar"; conta sem
        unidade = "Sem unidade". Saem só os grupos e as somas. Não grava nem envia nada.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: by, in: query, schema: { type: string, enum: [block, floor], default: block } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Vazio = hoje' }
      responses:
