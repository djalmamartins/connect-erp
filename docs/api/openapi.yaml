        content: { application/json: { schema: { type: object, required: [condominium_id], properties: { condominium_id: { type: integer }, as_of: { type: string, format: date }, min_days_late: { type: integer, minimum: 1 }, unit_ids: { type: array, items: { type: integer } }, send_at: { type: string } } } } }
      responses:
