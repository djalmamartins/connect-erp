        '200': { description: '{ data: { user_id, role, manageable, rows[{slug, name, group, description, role, override, effective}] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: setErpUserPermission
