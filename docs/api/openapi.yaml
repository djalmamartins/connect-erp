        - { name: adjustment, in: query, schema: { type: number, minimum: -50, maximum: 100, default: 0 } }
        - { name: distribution, in: query, schema: { type: string, enum: [flat, seasonal], default: flat } }
      responses:
        '200': { description: '{ data: { year, base_from, base_to, adjustment_percent, distribution, rows[{ chart_account_id, code, name, nature, base_months{1..12}, base_cents, suggested_months{1..12}, suggested_cents, current_budget_cents }], totals, warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: applyBudgetProposal
      summary: Grava a sugestão como previsão do ano (todas as contas ou as escolhidas) pelo mesmo caminho do POST /budgets; ano com mês fechado é recusado (erp.settings.manage, ADR 0187)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, year], properties: { condominium_id: { type: integer }, year: { type: integer }, adjustment: { type: number }, distribution: { type: string, enum: [flat, seasonal] }, chart_account_ids: { type: array, items: { type: integer } } } } } }
      responses:
        '200': { description: '{ data: { year, applied_accounts[], budget } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Ano com mês fechado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /budgets/fee-simulation:
    get:
      operationId: getFeeSimulation
      summary: Simulação da taxa condominial a partir da despesa prevista no ano, com fundo de reserva e margem de inadimplência, por unidade (erp.settings.view e erp.entries.view, ADR 0189)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: reserve_percent, in: query, schema: { type: number, minimum: 0, maximum: 30, default: 0 } }
        - { name: delinquency_percent, in: query, schema: { type: number, minimum: 0, maximum: 50, default: 0 } }
        - { name: split, in: query, schema: { type: string, enum: [fraction, equal], default: fraction } }
      responses:
        '200': { description: '{ data: { year, split, reserve_percent, delinquency_percent, budget_expense_cents, budget_revenue_cents, budget_expense_months, observed_delinquency{from, to, months, billed_cents, overdue_cents, percent}, compared_competence, monthly_total_cents, reserve_cents, missing_fraction[], blocked, message?, rows[{ unit_id, unit_label, ideal_fraction, fee_cents, billed_last_month_cents, variation_percent }], billed_last_month_cents, warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-fractions:
    post:
      operationId: setUnitFractions
      summary: Frações ideais em lote (AP-167), todas as unidades ativas e soma 1, tudo ou nada (erp.settings.manage e erp.units.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, fractions], properties: { condominium_id: { type: integer }, fractions: { type: object, additionalProperties: { type: string }, example: { '12': '0,25', '13': '75%' } } } } } }
      responses:
        '200': { description: '{ data: { units, fraction_sum } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /delinquency:
    get:
      operationId: listDelinquency
      summary: Contas a receber vencidas e em aberto por unidade (erp.agreements.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Data de referência; padrão hoje. Vence no dia = ainda não vencida.' }
      responses:
        '200': { description: '{ data: { as_of, units[{unit_id, unit_label, entries[{id, due_on, amount_cents, days_late, bucket}], amount_cents, max_days_late}], totals{units, entries, amount_cents, buckets{1-30, 31-60, 61-90, 90+}} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements:
    get:
      operationId: listAgreements
      summary: Acordos dos condomínios do escopo, com o andamento das parcelas
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página); cada acordo traz paid_installments, paid_cents, open_cents e settled' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAgreement
      summary: Acordo das contas vencidas de uma unidade (erp.agreements.manage)
      description: >-
        As contas escolhidas (da mesma unidade, em aberto, fora de acordo, sem boleto ativo e de
        competência aberta) ficam canceladas e ligadas ao acordo; as parcelas mensais viram contas a
        receber novas na conta de receita informada. total = original + fees − discount; a sobra de
        centavos vai para a primeira parcela. Multa e juros são informados, não calculados.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [unit_id, entry_ids, installments, first_due_on, chart_account_id], properties: { unit_id: { type: integer }, entry_ids: { type: array, items: { type: integer } }, installments: { type: integer, minimum: 1, maximum: 60 }, first_due_on: { type: string, format: date }, chart_account_id: { type: integer }, fees_cents: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }, discount_cents: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }, notes: { type: string, maxLength: 255 } } } } }
      responses:
        '201': { description: 'Acordo com originals[] e parcels[]' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Conta já paga, em outro acordo, com boleto ativo ou de competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements/{id}:
    get:
      operationId: showAgreement
      summary: Acordo com as contas renegociadas e as parcelas
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Acordo }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agreements/{id}/cancel:
    post:
      operationId: cancelAgreement
      summary: Cancela o acordo sem parcela paga; as contas originais voltam a valer (erp.agreements.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Já cancelado, parcela paga, boleto ativo em parcela ou competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements/suggestion:
    get:
      operationId: suggestAgreementCharges
      summary: Encargos sugeridos (correção, multa e juros) das contas escolhidas de uma unidade (erp.agreements.view)
      description: >-
        Pela regra do condomínio (ADR 0040). Mês sem índice entra como zero e aparece em
        missing_index. A sugestão vai como fees_cents no POST /agreements e pode ser mudada.
      security: [{ session: [] }]
      parameters:
        - { name: unit_id, in: query, required: true, schema: { type: integer } }
        - { name: entry_ids, in: query, required: true, schema: { type: string, example: '12,13' } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: '{ data: { rule, entries[{entry_id, days_late, correction_cents, fine_cents, interest_cents, charges_cents}], original_cents, correction_cents, fine_cents, interest_cents, fees_cents, total_cents, missing_index[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Conta paga, em acordo, com boleto ativo ou de competência fechada' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements/{id}/breach:
    post:
      operationId: breachAgreement
      summary: Grava a quebra do acordo, com motivo, quando a regra do condomínio indica (erp.agreements.manage)
      description: As parcelas não mudam. A situação calculada aparece em breach no GET do acordo.
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: 'Acordo com status breached' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Acordo não ativo ou fora da regra de quebra' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /billing-rules:
    get:
      operationId: showBillingRule
      summary: Regra de cobrança que vale para o condomínio (própria ou o padrão da Connect) (erp.billing_rules.view)
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = padrão da Connect' }]
      responses:
        '200': { description: '{ data: { fine_bp, monthly_interest_bp, price_index, breach_days_late, breach_open_installments, source: condominium|default|builtin } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveBillingRule
      summary: Grava a regra do condomínio, ou o padrão sem condominium_id (só com acesso a todos) (erp.billing_rules.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { condominium_id: { type: [integer, "null"] }, fine_bp: { type: integer, minimum: 0, maximum: 1000, example: 200 }, monthly_interest_bp: { type: integer, minimum: 0, maximum: 1000, example: 100 }, price_index: { type: string, enum: [IPCA, NONE] }, breach_days_late: { type: integer, minimum: 1, maximum: 365 }, breach_open_installments: { type: integer, minimum: 0, maximum: 60 } } } } }
      responses:
        '200': { description: Regra gravada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /price-indexes:
    get:
      operationId: listPriceIndexes
      summary: Variação mensal do índice (últimos 240 meses) (erp.billing_rules.view)
      security: [{ session: [] }]
      parameters: [{ name: code, in: query, schema: { type: string, enum: [IPCA], default: IPCA } }]
      responses:
        '200': { description: '{ data: [{ competence, rate_percent }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: setPriceIndex
      summary: Lança (ou corrige) a variação de um mês; exige acesso a todos os condomínios (erp.billing_rules.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [competence, rate_percent], properties: { code: { type: string, enum: [IPCA] }, competence: { type: string, example: '2026-10' }, rate_percent: { oneOf: [{ type: number }, { type: string, example: '0,44' }] } } } } }
      responses:
        '200': { description: '{ data: { code, saved } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /price-indexes/import:
    post:
      operationId: importPriceIndexes
      summary: Importa um arquivo de índices (uma linha AAAA-MM;variação por mês), sem rede (erp.billing_rules.manage)
      description: O arquivo inteiro é validado antes de gravar; mês já lançado é substituído.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content], properties: { code: { type: string, enum: [IPCA] }, content: { type: string, example: "2026-09;0,48\n2026-10;0,44" } } } } }
      responses:
        '200': { description: '{ data: { code, saved } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-documents:
    get:
      operationId: listUnitDocuments
      summary: Documentos da unidade emitidos (erp.unit_documents.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: unit_id, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [debt_certificate, delinquency_declaration, quittance, consent_letter, receipt] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página), sem o conteúdo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: issueUnitDocument
      summary: Emite certidão de débitos, declaração de inadimplência, quitação, carta de anuência ou recibo (erp.unit_documents.manage)
      description: >-
        debt_certificate sempre emite (result clear = nada consta). delinquency_declaration exige conta
        vencida em aberto. quittance exige until_competence e todas as contas até ela pagas.
        consent_letter exige não haver conta vencida e uma finalidade (purpose). receipt (AP-040, ADR 0057)
        exige entry_ids de contas a receber pagas da unidade, sem recibo válido. O conteúdo fica
        gravado com código de verificação.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind, unit_id], properties: { kind: { type: string, enum: [debt_certificate, delinquency_declaration, quittance, consent_letter, receipt] }, unit_id: { type: integer }, as_of: { type: string, format: date, description: 'Padrão hoje; não pode ser futura' }, until_competence: { type: string, example: '2026-10' }, purpose: { type: string, minLength: 5, maxLength: 40 }, entry_ids: { type: array, maxItems: 60, items: { type: integer }, description: 'Recibo: contas pagas cobertas' } } } } }
      responses:
        '201': { description: 'Documento com content, verification_code e verification_display' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Documento não cabe na situação da unidade (ex.: quitação com conta em aberto)' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-documents/verify/{code}:
    get:
      operationId: verifyUnitDocument
      summary: Confere a autenticidade pelo código (com ou sem hífens)
      security: [{ session: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string, example: 'ABCD-EFGH-JKMN-PQRS' } }]
      responses:
        '200': { description: 'Documento (mostra se foi cancelado)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /unit-documents/{id}:
    get:
      operationId: showUnitDocument
      summary: Documento com o conteúdo gravado na emissão
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Documento }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /unit-documents/{id}/cancel:
    post:
      operationId: cancelUnitDocument
      summary: Cancela o documento, com motivo (erp.unit_documents.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Já cancelado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /meter-readings:
    get:
      operationId: listMeterReadings
      summary: Leituras com consumo e valor (erp.meter_readings.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: competence, in: query, schema: { type: string, example: '2026-11' } }
        - { name: kind, in: query, schema: { type: string, enum: [agua, gas, energia] } }
      responses:
        '200': { description: '{ data: [{ meter_id, unit_label, kind, competence, previous_reading, reading, consumption, amount_cents, tariff_valid_from, billed }], total, totals: { consumption, amount_cents } } (até 500)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: recordMeterReading
      summary: Lança ou corrige a leitura do relógio na competência (erp.meter_readings.manage)
      description: >-
        Consumo = leitura − anterior (competência anterior ou leitura inicial do relógio); leitura menor
        é recusada. Valor pelas faixas progressivas vigentes na data da leitura (do condomínio ou o
        padrão da Connect). Corrigir só vale sem cobrança e sem leitura posterior.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [meter_id, competence, reading], properties: { meter_id: { type: integer }, competence: { type: string }, reading: { oneOf: [{ type: number, minimum: 0 }, { type: string, example: '123,456' }] }, read_on: { type: string, format: date, description: 'Padrão hoje; não pode ser futura' } } } } }
      responses:
        '201': { description: Leitura com consumo e valor }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Leitura já cobrada ou há leitura posterior' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /meter-readings/bill:
    post:
      operationId: billMeterReadings
      summary: Gera uma conta a receber por unidade com o consumo da competência (erp.meter_readings.manage)
      description: Só leituras com valor e ainda não cobradas; tudo ou nada; cobrar de novo não duplica.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, competence, kind, chart_account_id, due_on], properties: { condominium_id: { type: integer }, competence: { type: string }, kind: { type: string, enum: [agua, gas, energia] }, chart_account_id: { type: integer, description: 'Conta analítica de receita' }, due_on: { type: string, format: date } } } } }
      responses:
        '200': { description: '{ data: { competence, kind, created: [entry_id], skipped } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Cobrada em paralelo }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Dados inválidos ou um lançamento fora das regras (fields), ex.: competência fechada' }
  /unit-batches/preview:
    post:
      operationId: previewUnitBatch
      summary: Pré-visualiza o cadastro rápido de unidades (erp.units.manage, ADR 0140)
      description: >-
        Sequência blocos × andares × unidades por andar (número = andar + posição; térreo = só a posição), com
        andares e números pulados e unidades avulsas. Marca as que já existem no condomínio. Não grava.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitBatchInput' } } }
      responses:
        '200': { description: '{ data: { condominium_id, units: [{ block, number, floor, label, exists }], total, new, existing, type, private_area } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-batches:
    post:
      operationId: createUnitBatch
      summary: Cria as unidades novas da sequência, todas ou nenhuma (erp.units.manage, ADR 0140)
      description: Mesmo corpo da pré-visualização. Unidades que já existem ficam como estão; cada criada é auditada.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitBatchInput' } } }
      responses:
        '201': { description: '{ data: { created, skipped, ids: [int] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-measures:
    get:
      operationId: listUnitMeasures
      summary: Fração ideal e área das unidades ativas do condomínio (erp.units.view, ADR 0140)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { condominium_id, units: [{ id, label, block, number, floor, type, ideal_fraction, private_area }], fraction_sum, area_sum, missing_fraction, missing_area, complete } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    put:
      operationId: saveUnitMeasures
      summary: Grava fração ideal e área de várias unidades (erp.units.manage, ADR 0140)
      description: >-
        Campo ausente não muda; vazio limpa. Só as unidades alteradas são gravadas e auditadas. A soma das frações
        não passa de 1; com todas preenchidas, precisa dar 1 dentro de params.fraction_tolerance. Tudo ou nada.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, units], properties: { condominium_id: { type: integer }, units: { type: array, maxItems: 2000, items: { type: object, required: [id], properties: { id: { type: integer }, ideal_fraction: { type: string, nullable: true, example: '0,012500 ou 1,25%' }, private_area: { type: string, nullable: true, example: '72,50' } } } } } } } }
      responses:
        '200': { description: 'Mesmo formato do GET, com updated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /employees/terminate:
    post:
      operationId: terminateEmployees
      summary: Desligamento em lote de funcionários (data e motivo), pelo formulário, tudo ou nada e com prévia (erp.employees.view e erp.employees.manage, ADR 0225)
      description: >-
        Grava só a data de desligamento pelo RegistryService::save do cadastro (a situação do cadastro não muda). Recusa
        funcionário não encontrado, inativo, já desligado (a data não é trocada aqui) ou admitido depois da data. Data até
        30 dias à frente. Auditoria terminate por funcionário. Nada é enviado (rescisão e eSocial ficam fora). Sem nome, CPF,
        contato ou salário na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, employee_ids, terminated_on, reason], properties: { condominium_id: { type: integer }, employee_ids: { type: array, items: { type: integer }, maxItems: 300 }, terminated_on: { type: string, format: date }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, terminated_on, reason, count, changed, employees[{ id, job, shift, hired_on, terminated_on }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida ou funcionário recusado (errors com _form e _employee, ou os erros do formulário); nada é gravado' }
  /employees/readjust-salaries:
    post:
      operationId: readjustEmployeeSalaries
      summary: Reajuste salarial em lote dos funcionários do condomínio (percentual sobre o salário, mesma regra da 0204), pelo formulário, tudo ou nada e com prévia (erp.employees.view e erp.employees.manage, ADR 0223)
      description: >-
        Sem employee_ids, entram os funcionários ativos com salário e sem desligamento até effective_on (opcionalmente só
        de uma função). Com employee_ids, recusa funcionário não encontrado, inativo, desligado até a data ou sem
        salário. Auditoria readjust por funcionário. Nada é enviado; os lançamentos fixos de salário não mudam (reajuste da
        0204). Sem nome, CPF, telefone ou e-mail na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, percent, effective_on, reason], properties: { condominium_id: { type: integer }, percent: { type: string, example: '5,5' }, effective_on: { type: string, format: date }, reason: { type: string, minLength: 5, maxLength: 255 }, job: { type: string }, employee_ids: { type: array, items: { type: integer }, maxItems: 300 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, percent, effective_on, job, reason, before_cents, after_cents, count, changed, employees[{ id, job, shift, salary_before_cents, salary_after_cents }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida ou funcionário recusado (errors com _form e _employee, ou os erros do formulário); nada é gravado' }
  /reservations/expire-pending:
    post:
      operationId: expirePendingReservations
      summary: Cancela em lote as reservas que passaram sem aprovação (aguardando aprovação com data antes do corte), pelo formulário, tudo ou nada e com prévia (erp.reservations.view e erp.reservations.manage, ADR 0221)
      description: >-
        Sem reservation_ids, entram todas as reservas aguardando aprovação do condomínio com data antes de before (padrão
        hoje, nunca depois de hoje). Com reservation_ids, cada uma precisa estar aguardando aprovação e com a data passada.
        Reserva confirmada não é tocada. Cancelar não gera aviso na outbox (o aviso é só da aprovação). Auditoria expire por
        reserva. Sem nome de morador na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, reason], properties: { condominium_id: { type: integer }, before: { type: string, format: date }, reservation_ids: { type: array, items: { type: integer }, maxItems: 500 }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, before, reason, count, changed, reservations[{ id, common_area_id, unit_id, reserved_on, fee_cents }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida ou reserva recusada (errors com _form e _reservation, ou os erros do formulário); nada é gravado' }
  /contracts/renew:
    post:
      operationId: renewContracts
      summary: Renova contratos em lote (fim + meses) com reajuste opcional do valor mensal, pelo formulário, tudo ou nada e com prévia (erp.contracts.view e erp.contracts.manage, ADR 0217)
      description: >-
        Mesmo percentual e arredondamento do reajuste de lançamentos fixos (RecurringReadjustment, ADR 0204). O dia que não
        existe no mês de destino vira o último dia dele. Recusa contrato não encontrado, encerrado ou cancelado, de prazo
        indeterminado ou "sem reajuste" com percentual. Auditoria renew por contrato. O lançamento fixo que paga o
        contrato não muda (use o reajuste da ADR 0204). Nada é enviado.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, contract_ids, months, reason], properties: { condominium_id: { type: integer }, contract_ids: { type: array, items: { type: integer }, maxItems: 200 }, months: { type: integer, minimum: 1, maximum: 60 }, percent: { type: string, example: '4,62', description: 'Opcional; de −50 a 100, até 2 casas' }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, months, percent, reason, before_cents, after_cents, count, changed, contracts[{ id, supplier_id, readjustment, ends_on_before, ends_on_after, monthly_before_cents, monthly_after_cents }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida ou contrato recusado (errors com _form e _contract, ou os erros do formulário); nada é gravado' }
  /document-transit/settle:
    post:
      operationId: settleDocumentTransit
      summary: Baixa em lote de malotes (recebido, conferido) e avisos de recebimento (entregue, devolvido) pelo formulário, tudo ou nada e com prévia (erp.pouches.* e erp.delivery_notices.*, ADR 0216)
      description: >-
        Cada documento é regravado pelo RegistryService::save do cadastro, com as regras do formulário. Malote enviado
        fica recebido (com check, também conferido); malote recebido fica conferido; AR em trânsito fica entregue
        (outcome delivered) ou devolvido (returned). Documento de outro condomínio, apagado ou já resolvido recusa o lote
        antes de gravar. Auditoria transit_settle por documento. Nada é enviado. Sem portador, conteúdo, destinatário,
        assunto ou rastreio na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, on], properties: { condominium_id: { type: integer }, on: { type: string, format: date, description: 'Não pode ser futura' }, pouch_ids: { type: array, items: { type: integer } }, notice_ids: { type: array, items: { type: integer } }, check: { type: boolean, default: false }, outcome: { type: string, enum: [delivered, returned], default: delivered }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, on, check, outcome, settled, changed, documents[{ kind (pouch|notice), id, status_before, status_after }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, documento já resolvido ou fora do condomínio (errors com tipo:id), ou recusado pelo formulário (errors e _pouch/_notice); nada é gravado' }
  /occurrences/sync-tickets:
    post:
      operationId: syncOccurrenceTickets
      summary: Resolve as ocorrências do condomínio cujo chamado no Help Desk foi fechado, pelo formulário, tudo ou nada e com prévia (erp.occurrences.view e erp.occurrences.manage, ADR 0213)
      description: >-
        Lê a situação do chamado pelo TicketService::findFor (mesmo escopo). Fechado (closed) resolve; resolvido
        (resolved) só com include_resolved, porque ainda pode ser reaberto. As outras vêm contadas em still_open pela
        situação do chamado; chamado fora do escopo, em unavailable. Nada muda no Help Desk e nada é enviado. Sem
        assunto, descrição, morador ou solicitante na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id], properties: { condominium_id: { type: integer }, include_resolved: { type: boolean, default: false }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, include_resolved, checked, settled, still_open { situação do chamado: quantidade }, unavailable, changed, occurrences[{ id, priority, occurred_on, status_before, ticket_protocol, ticket_status }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou ocorrência recusada pelo formulário (errors e _occurrence); nada é gravado' }
  /reservations/bill-fees:
    post:
      operationId: billReservationFees
      summary: Cobrança das taxas das reservas confirmadas do período, cada uma como cobrança extra da unidade (EntryShortcuts::createCharge), uma vez só, tudo ou nada e com prévia (erp.reservations.view, erp.invoices.view e erp.invoices.manage, ADR 0212)
      description: >-
        Entram as reservas confirmadas, não excluídas, com taxa maior que zero e sem cobrança extra ativa da própria
        reserva (already_billed conta as já cobradas; cancelada a cobrança, volta a entrar). Competência = mês da
        reserva; vencimento e conta de receita informados. Mês fechado ou outra recusa da cobrança extra desfaz todas.
        Nada é enviado. Sem nome de morador.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, from, to, due_on, chart_account_id], properties: { condominium_id: { type: integer }, from: { type: string, format: date }, to: { type: string, format: date }, due_on: { type: string, format: date }, chart_account_id: { type: integer }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, from, to, dry_run, count, total_cents, already_billed, changed, reservations[{ id, area, reserved_on, fee_cents, charge_id }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou reserva recusada pela cobrança extra (errors com _form e _reservation); nada é gravado' }
  /maintenances/complete:
    post:
      operationId: completeMaintenances
      summary: Conclusão de manutenções em lote pelo formulário, com a próxima periódica agendada, tudo ou nada e prévia (erp.maintenances.view e erp.maintenances.manage, ADR 0208)
      description: >-
        Cada manutenção agendada ou em execução fica concluída em done_on (até hoje). Nas periódicas, com schedule_next
        (padrão), a próxima é criada com o mesmo serviço, fornecedor e periodicidade, na data prevista + período (fim de
        mês ajustado), a primeira depois da conclusão; se a mesma já está agendada nessa data, não duplica
        (already_scheduled). Recusa não encontrada, concluída ou cancelada, e as regras do formulário (fornecedor ativo).
        Uma recusada desfaz todas. Nada é enviado.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, items], properties: { condominium_id: { type: integer }, items: { type: array, minItems: 1, maxItems: 100, items: { type: object, required: [id, done_on], properties: { id: { type: integer }, done_on: { type: string, format: date } } } }, schedule_next: { type: boolean, default: true }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, schedule_next, count, completed, scheduled, already_scheduled, changed, maintenances[{ id, service, frequency, planned_on, done_on, next { id, planned_on, already_scheduled } | null }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou manutenção recusada (errors e _maintenance); nada é gravado' }
  /units/move-out:
    post:
      operationId: unitMoveOut
      summary: Saída de moradores da unidade, encerrando os vínculos pelo formulário, revogando convites pendentes e, se pedido, inativando veículos e animais, tudo ou nada e com prévia (erp.residents.view e erp.residents.manage, ADR 0206)
      description: >-
        Vínculos padrão: inquilino e morador (proprietário e responsável financeiro só se pedidos). Fim do vínculo = ends_on
        (até hoje) e situação inativa. Convites pendentes do portal dessas pessoas são revogados. include_vehicles exige
        erp.vehicles.manage; include_pets exige erp.pets.manage. Nada é apagado nem enviado (sem e-mail). Avisos:
        unit_without_residents e open_debt. Saem só ids, tipos de vínculo e datas.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, unit_id, ends_on, reason], properties: { condominium_id: { type: integer }, unit_id: { type: integer }, relationships: { type: array, items: { type: string, enum: [owner, tenant, resident, financial] }, description: 'Vazio = tenant e resident' }, ends_on: { type: string, format: date }, reason: { type: string, minLength: 5, maxLength: 255 }, include_vehicles: { type: boolean, default: false }, include_pets: { type: boolean, default: false }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, unit_id, dry_run, ends_on, reason, relationships[], residents[{ id, relationship, starts_on, ends_on }], vehicles, pets, invitations_revoked, changed, warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, unidade sem vínculo ativo dos tipos escolhidos, ou registro recusado pelo formulário (errors, _registry e _record); nada é gravado' }
  /unit-measures/distribute:
    post:
      operationId: distributeUnitFractions
      summary: Propõe a divisão de 100% igualmente ou pela área, sem gravar (erp.units.manage, ADR 0140)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode, units], properties: { mode: { type: string, enum: [equal, area] }, units: { type: array, maxItems: 2000, items: { type: object, required: [id], properties: { id: { type: integer }, private_area: { type: string, description: 'Obrigatória em todas com mode=area' } } } } } } } }
      responses:
        '200': { description: '{ data: { fractions: { "<id>": "0.008772" } } } — soma exata 1.000000' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /documents:
    get:
      operationId: listVirtualDisk
      summary: Arquivos do Disco Virtual (erp.documents.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: folder, in: query, schema: { type: string, enum: [atas, contratos, plantas, notas_fiscais, outros] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Título ou nome do arquivo }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (50 por página): id, folder, title, original_name, mime, size_bytes, sha256, uploaded_at' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: uploadVirtualDisk
      summary: Envia um arquivo (erp.documents.manage)
      description: >-
        Tipo conferido pelo conteúdo, com extensão correspondente: PDF, JPG, PNG, WebP, DOCX, XLSX,
        ODT, ODS, CSV ou TXT; no máximo 20 MB. Guardado fora da pasta pública com nome gerado. O mesmo
        arquivo na mesma pasta do condomínio é recusado (409).
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [condominium_id, folder, file], properties: { condominium_id: { type: integer }, folder: { type: string, enum: [atas, contratos, plantas, notas_fiscais, outros] }, title: { type: string, maxLength: 160 }, file: { type: string, format: binary } } } } }
      responses:
        '201': { description: Arquivo enviado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Arquivo já está na pasta }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Tipo, extensão, tamanho ou pasta inválidos' }
  /documents/{id}:
    get:
      operationId: showVirtualDiskFile
      summary: Dados do arquivo
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Arquivo }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteVirtualDiskFile
      summary: Exclusão lógica; o arquivo continua guardado (erp.documents.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Excluído }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /documents/{id}/download:
    get:
      operationId: downloadVirtualDiskFile
      summary: Baixa o arquivo como anexo (erp.documents.view, no escopo)
      description: 'Content-Disposition attachment, X-Content-Type-Options nosniff, CSP sandbox, Cache-Control no-store.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Conteúdo do arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /entries/{id}/attachments:
    get:
      operationId: listEntryAttachments
      summary: Anexos do lançamento (erp.entries.view, ADR 0174)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: [{ id, entry_id, document_id, kind, kind_label, title, original_name, mime, size_bytes, sha256, scan_status, attached_at }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: attachToEntry
      summary: Anexa nota fiscal, comprovante, recibo ou outro documento ao lançamento (erp.entries.manage)
      description: >-
        O arquivo vai para o Disco Virtual (mesmas regras do ADR 0047: tipo pelo conteúdo, 20 MB, antivírus). Nota
        fiscal na pasta notas_fiscais, comprovante e recibo em comprovantes, outro em outros. O mesmo arquivo já na
        pasta é reaproveitado; no mesmo lançamento, 409. Até 20 anexos por lançamento. Vale em competência fechada.
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [nota_fiscal, comprovante, recibo, outro] }
                title: { type: string, maxLength: 160 }
                file: { type: string, format: binary }
      responses:
        '201': { description: '{ data: anexo }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Arquivo já anexado a este lançamento }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { description: Antivírus obrigatório fora do ar (ADR 0098) }
  /entries/{id}/attachments/{attachment}/download:
    get:
      operationId: downloadEntryAttachment
      summary: Baixa o anexo do lançamento (erp.entries.view, no escopo)
      description: 'Content-Disposition attachment, X-Content-Type-Options nosniff, CSP sandbox, Cache-Control no-store. Bloqueado pelo antivírus = 403.'
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: attachment, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Conteúdo do arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /entries/{id}/attachments/{attachment}:
    delete:
      operationId: removeEntryAttachment
      summary: Remove o anexo do lançamento (erp.entries.manage); o arquivo continua no Disco Virtual
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: attachment, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Removido }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Competência fechada no fechamento mensal }
  /occurrences/{id}/ticket:
    post:
      operationId: openOccurrenceTicket
      summary: Abre o chamado da ocorrência na fila do Help Desk (erp.occurrences.manage)
      description: >-
        Origem erp, com condomínio, unidade, assunto, descrição e prioridade da ocorrência (baixa,
        média e alta viram low, medium e high). Uma ocorrência abre no máximo um chamado; o ticket_id
        fica gravado na ocorrência (só leitura no cadastro /occurrences).
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '201': { description: '{ data: { occurrence_id, ticket_id, protocol } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A ocorrência já tem chamado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: Chamado recusado pelo Help Desk (field e message) }
  /dashboard:
    get:
      operationId: operationalDashboard
      summary: Números e alertas reais da administradora no contexto (erp.access e erp.units.view, ADR 0111)
      description: >-
        cards: maintenances_late, maintenances_week, insurances_renewal (até 30 dias), insurances_expired,
        contracts_renewal, contracts_expired, reservations_pending, occurrences_open, deliveries_waiting,
        receivables_overdue_cents, receivables_week_cents, payables_week_cents, waitlist_to_call.
        alerts: [{kind, severity (danger, warning, info), count, message, route}] só com contagem maior que zero.
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }]
      responses:
        '200': { description: '{ data: { as_of, condominium_id, cards, alerts } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard/finance:
    get:
      operationId: dashboardFinance
      summary: Receitas e despesas, inadimplência por atraso e quadro por condomínio do dashboard (erp.entries.view, ADR 0157)
      description: >-
        months: os 6 meses até a competência, por competência como o balancete ({competence, label, revenue_cents,
        revenue_received_cents, expense_cents, expense_paid_cents}). month: a competência escolhida com result_cents
        (recebido menos pago), balance_cents (lançado), received_rate e os totais do mês anterior.
        delinquency: {open_cents, buckets: [{key (1-30, 31-60, 61-90, 90+), label, amount_cents}]}.
        condominiums: [{id, name, city, units, revenue_cents, received_cents, overdue_cents, expense_cents,
        received_rate, delinquency_rate, status (Em dia, Atenção, Crítico, Sem lançamentos)}].
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: competence, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 'AAAA-MM; vazio = mês atual' }
      responses:
        '200': { description: '{ data: { competence, as_of, months, month, delinquency, condominiums } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /dashboard/agenda:
    get:
      operationId: dashboardAgenda
      summary: Próximos 30 dias do dashboard (assembleias, manutenções e reservas que o usuário pode ver), ADR 0157
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }]
      responses:
        '200': { description: '{ data: { items: [{ date, time, kind (assembly, maintenance, reservation), title, text, href }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard/activities:
    get:
      operationId: dashboardActivities
      summary: Últimas ações da equipe nos módulos do ERP, só de registros do contexto (erp.audit.view), ADR 0157
      description: Sem dados pessoais do registro; mostra módulo, ação, número do registro, condomínio e quem fez.
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }]
      responses:
        '200': { description: '{ data: { items: [{ at, icon, title, text, href }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations/{id}/call-waitlist:
    post:
      operationId: callWaitlist
      summary: Chama o primeiro da lista de espera da data e da área de uma reserva cancelada (erp.reservations.manage)
      description: Só registra a chamada (quem, quando, para qual reserva); a reserva nova é feita por quem foi chamado, pelas regras da área.
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { reservation_id, waitlist_id, resident_name, unit_id, called_at } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Reserva não cancelada, data já reservada de novo ou ninguém aguardando' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /maintenances/{id}/next:
    post:
      operationId: nextMaintenance
      summary: Gera a próxima manutenção de uma concluída pela periodicidade, uma vez só (erp.maintenances.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '201': { description: '{ data: { id, previous_id, planned_on, service, status } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Não concluída ou a próxima já foi gerada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: Manutenção única (sem periodicidade) }
  /panels/condominium/{id}:
    get:
      operationId: condominiumPanel
      summary: Painel do condomínio (AP-002) (erp.access e erp.units.view)
      description: >-
        occupancy (unidades, ocupadas por morador ativo, vagas, taxa); finance (saldo das contas
        bancárias, inadimplência com encargos e faixas, fechamento e resultado da competência atual);
        operations (os cards e alertas do /dashboard para o condomínio).
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { condominium, as_of, occupancy, finance, operations } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /panels/unit/{id}:
    get:
      operationId: unitPanel
      summary: Painel da unidade (AP-003) (erp.access e erp.units.view)
      description: >-
        unit; people (moradores e proprietários ativos); finance (vencidas com encargos, a vencer, acordos
        ativos ou quebrados); documents (últimos 10 emitidos); operations (entregas aguardando, reservas
        futuras, ocorrências abertas, veículos e animais).
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { unit (com address), as_of, people (ficha: document, phone, email, starts_on, ends_on, billing_by_email, notices_opt_out, notes, has_portal_account, other_units), finance, documents, operations } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications:
    get:
      operationId: listNotifications
      summary: Avisos da fila do ERP (erp.notifications.view)
      description: >-
        Modo de entrega (delivery_mode): log (nada enviado), sandbox (só para a caixa de teste
        ERP_MAIL_SANDBOX_TO) ou production (só com APP_ENV=production e ERP_MAIL_DELIVERY=production).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, processing, sent, failed, cancelled] } }
      responses:
        '200': { description: '{ data: [{ id, event_type, status, delivery_mode, recipients_count, attempts, available_at, processed_at, last_error }], total } (até 200)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/dispatch:
    post:
      operationId: dispatchNotifications
      summary: Processa a fila agora, até 50 avisos (erp.notifications.manage)
      security: [{ session: [], csrf: [] }]
      responses:
        '200': { description: '{ data: { mode, processed, sent, failed, retry, cancelled } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /notifications/{id}:
    get:
      operationId: showNotification
      summary: Aviso com a trilha de entrega (e-mail mascarado; endereço efetivo no sandbox)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 'Aviso com deliveries[]' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/{id}/retry:
    post:
      operationId: retryNotification
      summary: Reenvia aviso com falha ou cancelado (erp.notifications.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Aviso de volta à fila }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Aviso não está com falha nem cancelado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }

  /entries/{id}/discount:
    post:
      operationId: discountEntry
      summary: Desconto numa conta a receber em aberto (AP-026, erp.entries.manage)
      description: >-
        Reduz o valor com trilha (antes, depois, motivo). O desconto é menor que o valor (para perdoar,
        cancele o lançamento). Recusa conta paga, cancelada, parcela ou original de acordo, boleto ativo e
        competência fechada (ADR 0031).
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount_cents, reason], properties: { amount_cents: { type: string, example: '50,00' }, reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: '{ data: { entry_id, adjustment_id, before_cents, discount_cents, after_cents, adjustments[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Conta paga, de acordo, com boleto ativo ou competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /entries/{id}/adjustments:
    get:
      operationId: listEntryAdjustments
      summary: Trilha dos descontos de uma conta (erp.entries.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: [{ id, kind, amount_cents, before_cents, after_cents, reason, created_by, created_at }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /entries/settle:
    post:
      operationId: settleEntries
      summary: Baixa em lote, tudo ou nada; dry_run confere sem gravar (erp.entries.view e erp.entries.manage, ADR 0191)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, bank_account_id, paid_on, entry_ids], properties: { condominium_id: { type: integer }, bank_account_id: { type: integer }, paid_on: { type: string, format: date }, entry_ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer } }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, bank_account_id, bank_account, paid_on, dry_run, settled, count, totals{ receita_cents, despesa_cents, net_cents }, entries[{ id, nature, description, amount_cents, competence, due_on }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida (validation_failed) ou lote recusado (settlement_rejected, com problems[{ entry_id, code: not_found|cancelled|already_paid|closed_competence, message }]); nada é gravado' }
  /entries/unsettle:
    post:
      operationId: unsettleEntries
      summary: Estorno em lote da baixa, tudo ou nada, com motivo; dry_run confere sem gravar (erp.entries.view e erp.entries.manage, ADR 0192)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, entry_ids, reason], properties: { condominium_id: { type: integer }, entry_ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer } }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, reversed, count, reason, totals{ receita_cents, despesa_cents, net_cents }, entries[{ id, nature, description, amount_cents, competence, paid_on, bank_account_id }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida (validation_failed) ou lote recusado (reversal_rejected, com problems[{ entry_id, code: not_found|cancelled|not_paid|closed_competence|receipt|reconciled|bank_confirmed|changed, message }]); nada é gravado' }
  /entries/installments:
    post:
      operationId: createInstallmentPayables
      summary: Despesa parcelada, N contas a pagar de uma compra, pelas regras do formulário, tudo ou nada; dry_run monta as parcelas sem gravar (erp.entries.view e erp.entries.manage, ADR 0195)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, chart_account_id, description, total, installments, first_due_on], properties: { condominium_id: { type: integer }, chart_account_id: { type: integer }, description: { type: string, maxLength: 150 }, total: { type: string, description: 'Valor total, ex.: 1.234,56 (ou inteiro em centavos)' }, installments: { type: integer, minimum: 2, maximum: 60 }, first_due_on: { type: string, format: date }, competence: { type: string, pattern: '^\d{4}-\d{2}$', description: 'Vazio = a do vencimento de cada parcela' }, cost_center_id: { type: integer }, supplier_id: { type: integer }, document_number: { type: string }, bank_account_id: { type: integer }, notes: { type: string }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: 'dry_run: { data: { condominium_id, dry_run, installments, total_cents, plan[{ installment, description, amount_cents, due_on, competence }], entries: [] } }' }
        '201': { description: '{ data: { ..., plan[], entries[{ id, installment, description, amount_cents, due_on, competence }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou parcela recusada pelas regras do formulário (errors por campo e _installment); nada é gravado' }
  /entries/reclassify:
    post:
      operationId: reclassifyEntries
      summary: Reclassificação em lote, troca a conta e/ou o centro de custo de vários lançamentos pelas regras do formulário, com motivo, tudo ou nada (erp.entries.view e erp.entries.manage, ADR 0196)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, entry_ids, reason], properties: { condominium_id: { type: integer }, entry_ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer } }, chart_account_id: { type: integer }, cost_center_id: { type: integer, description: '0 tira o centro de custo' }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, reason, changes, count, changed, entries[{ id, description, competence, before{ chart_account_id, cost_center_id }, after{ chart_account_id, cost_center_id } }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou lançamento recusado pelas regras do formulário (errors por campo e _entry); nada é gravado' }
  /entries/reschedule:
    post:
      operationId: rescheduleEntries
      summary: Prorrogação de vencimento em lote de contas em aberto, para uma data ou deslocando N dias, pelas regras do formulário, com motivo, tudo ou nada (erp.entries.view e erp.entries.manage, ADR 0197)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, entry_ids, reason], properties: { condominium_id: { type: integer }, entry_ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer } }, due_on: { type: string, format: date, description: 'Novo vencimento para todas (ou days)' }, days: { type: integer, minimum: -365, maximum: 365, description: 'Desloca cada vencimento (ou due_on), diferente de zero' }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, reason, due_on, days, count, changed, entries[{ id, description, competence, before, after }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou conta recusada (paga, cancelada, com boleto ativo, mês fechado, trava de origem; errors e _entry); nada é gravado' }
  /entries/cancel:
    post:
      operationId: cancelEntries
      summary: Cancelamento de contas em aberto em lote, pelas regras do formulário, com motivo, tudo ou nada e prévia (erp.entries.view e erp.entries.manage, ADR 0203)
      description: >-
        Recusa conta já cancelada, já paga (estorne antes), com boleto pendente ou registrado no banco, com boleto pago ou
        conciliada (ADR 0194), com recibo válido, gerada por fatura, acordo, cobrança extra ou multa, ou em mês fechado.
        Uma recusada desfaz todas. dry_run devolve a prévia sem gravar. Cancelar não exclui: a conta fica "Cancelado".
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, entry_ids, reason], properties: { condominium_id: { type: integer }, entry_ids: { type: array, minItems: 1, maxItems: 200, items: { type: integer } }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, reason, count, changed, total_cents, entries[{ id, description, nature, competence, due_on, amount_cents }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou conta recusada (errors e _entry); nada é gravado' }
  /suppliers/deactivate:
    post:
      operationId: deactivateSuppliers
      summary: Inativação de fornecedores em lote, com motivo, tudo ou nada e prévia (erp.suppliers.view e erp.suppliers.manage, só com acesso a todos os condomínios, ADR 0202)
      description: >-
        Recusa fornecedor não encontrado, já inativo, com conta a pagar em aberto em qualquer condomínio, com lançamento
        recorrente ativo ou com empenho ativo. Um recusado desfaz todos. dry_run devolve a prévia sem gravar.
        Inativar não apaga lançamentos nem histórico; o fornecedor volta pelo formulário.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [supplier_ids, reason], properties: { supplier_ids: { type: array, minItems: 1, maxItems: 100, items: { type: integer } }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { dry_run, reason, count, changed, suppliers[{ supplier_id, legal_name, trade_name, document_masked, last_used_on }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Sem permissão, ou sem acesso a todos os condomínios' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida, ou fornecedor recusado (errors e _supplier); nada é gravado' }
  /extra-charges:
    get:
      operationId: listExtraCharges
      summary: Multas avulsas e cobranças extras (AP-027/028, erp.invoices.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: kind, in: query, schema: { type: string, enum: [extra, fine] } }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }
      responses:
        '200': { description: '{ data[], total }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createExtraCharge
      summary: Gera multa avulsa (uma unidade, com motivo) ou cobrança extra (uma ou mais unidades) (erp.invoices.manage)
      description: >-
        Uma conta a receber por unidade, travada no cadastro (altere ou cancele pela origem). method fixed =
        valor por unidade; equal = total dividido igual; fraction = total pela fração ideal. Multa é sempre
        fixed. Vencimento não pode ser no passado; competência fechada recusa.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, kind, description, chart_account_id, competence, due_on, amount_cents, unit_ids], properties: { condominium_id: { type: integer }, kind: { type: string, enum: [extra, fine] }, description: { type: string, minLength: 3, maxLength: 120 }, chart_account_id: { type: integer, description: 'Conta analítica de receita' }, competence: { type: string, example: '2026-11' }, due_on: { type: string, format: date }, method: { type: string, enum: [fixed, equal, fraction] }, amount_cents: { type: string, example: '120,00' }, unit_ids: { type: array, items: { type: integer } }, related_entry_id: { type: integer, description: 'Multa: conta a que se refere' }, reason: { type: string, description: 'Multa: obrigatório' } } } } }
      responses:
        '201': { description: Cobrança com as contas geradas }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /extra-charges/{id}:
    get:
      operationId: getExtraCharge
      summary: Multa ou cobrança extra com as contas geradas (erp.invoices.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { ..., entries[{ entry_id, unit_label, amount_cents, status, paid_on }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /extra-charges/{id}/cancel:
    post:
      operationId: cancelExtraCharge
      summary: Cancela a multa ou cobrança extra e as contas geradas (erp.invoices.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Conta paga, em acordo, com boleto ativo ou competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bank-transfers:
    get:
      operationId: listBankTransfers
      summary: Transferências entre contas bancárias (AP-029, erp.entries.view)
      security: [{ session: [] }]
