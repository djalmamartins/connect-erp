      responses:
        '200': { description: '{ data: { administrator, global_access, previous_month, summary } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/sent:
    get:
      operationId: sentReports
      summary: Relatórios exportados, lidos da auditoria (erp.audit.view, ADR 0168)
      security: [{ session: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: report, in: query, schema: { type: string, example: ledger } }
      responses:
        '200': { description: '{ data: { rows[{id, created_at, user_name, entity, ip, report, condominium_id, bytes}], totals, truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /erp-users:
    get:
      operationId: erpUsers
      summary: Usuários com acesso aos condomínios do escopo, com e-mail mascarado (erp.users.view, ADR 0168)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
      responses:
        '200': { description: '{ data: { rows[{id, name, email, status, role, role_name, manageable, condominiums[]}], truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /erp-users/invite:
    post:
      operationId: erpUsersInvite
      summary: Dá acesso a condomínios do escopo para uma conta que já existe (erp.users.manage, ADR 0168)
      description: Não cria conta nem troca papel; isso continua no Studio. O papel da conta precisa ter erp.access.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, condominium_ids]
              properties:
                email: { type: string, format: email }
                condominium_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 200 }
      responses:
        '200': { description: '{ data: { user_id, granted[], already[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /erp-users/{id}/deactivate:
    post:
      operationId: erpUsersDeactivate
      summary: Tira o acesso a um condomínio ou a todos do escopo (erp.users.manage, ADR 0168)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condominium_id: { type: integer }
      responses:
        '200': { description: '{ data: { user_id, revoked[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Sem acesso a condomínios do escopo }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /erp-users/{id}/permissions:
    get:
      operationId: erpUserPermissions
