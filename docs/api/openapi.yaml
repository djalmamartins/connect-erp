  /visit-forecasts/expire:
    post:
      operationId: expireVisitForecasts
      summary: Baixa em lote das visitas previstas que passaram sem acontecer (situação Cancelada pelo cadastro), tudo ou nada e com prévia (erp.access, erp.visit_forecasts.view e erp.visit_forecasts.manage, ADR 0231)
      description: >-
        Sem forecast_ids, entram as visitas previstas em aberto do condomínio cuja data (ou o fim, expected_until) é
        anterior a before (padrão hoje; nunca depois de hoje). Com forecast_ids, recusa visita não encontrada no
        condomínio, realizada ou cancelada, cuja data ainda não passou ou com acesso registrado na portaria (essa
        aconteceu: marque como realizada). Sem forecast_ids, as visitas com acesso ficam de fora e a contagem sai em
        skipped_with_access. Cada visita é regravada pelo cadastro só com a
        situação Cancelada (auditoria update do formulário e expire por visita). Nenhum aviso é enviado. Sem visitante,
        documento, unidade, autorizador ou observação na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, reason], properties: { condominium_id: { type: integer }, before: { type: string, format: date }, forecast_ids: { type: array, items: { type: integer }, maxItems: 500 }, reason: { type: string, minLength: 5, maxLength: 255 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, before, reason, skipped_with_access, count, changed, forecasts[{ id, expected_on, expected_until }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida ou visita recusada (errors com _form ou os erros do formulário, e _forecast); nada é gravado' }
  /reports/gatehouse-traffic:
    get:
      operationId: gatehouseTraffic
      summary: Movimento da portaria do condomínio por tipo de acesso no período (entradas, com veículo, com unidade, de visita prevista, saídas sem registro, permanência e faixa do dia) e as visitas previstas, somente leitura (erp.access, erp.access_logs.view e erp.visit_forecasts.view, ADR 0230)
      description: >-
        Uma linha por tipo do registro de acessos (visitante, prestador, entregador, morador), sem os excluídos e sem os
        cancelados. Permanência = saída menos entrada no mesmo dia; faixas madrugada (0–6 h), manhã, tarde e noite. Os
        totais são a soma das linhas. As visitas previstas no período saem à parte (total = realizadas + canceladas + em
        aberto; overdue = em aberto com a data já passada). Sem nome, documento, placa, unidade, portaria ou observação.
        Não grava nem envia nada.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Vazio = primeiro dia do mês de "to"' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Vazio = hoje; período de até 366 dias' }
      responses:
        '200': { description: '{ data: { condominium_id, from, to, rows[{ kind, kind_label, entries, with_vehicle, with_unit, from_forecast, exited, no_exit, timed, stay_minutes_total, avg_stay_minutes, by_band{ madrugada, manha, tarde, noite } }], totals { entries, with_vehicle, with_unit, from_forecast, exited, no_exit, timed, stay_minutes_total, avg_stay_minutes, by_band }, forecasts { total, done, cancelled, open, overdue } } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/common-area-usage:
    get:
      operationId: commonAreaUsage
      summary: Uso dos espaços comuns do condomínio por área no período (reservas confirmadas, aguardando e canceladas, taxa, dias usados, ocupação, unidades distintas e dia da semana), somente leitura (erp.access e erp.reservations.view, ADR 0228)
      description: >-
        Uma linha por área comum (as ativas, mesmo sem reserva, e as inativas com reserva no período), com os rótulos do
        cadastro. Taxa só das confirmadas; days_used = dias distintos com reserva confirmada; occupancy_pct = days_used ÷
        dias do período; units = unidades distintas (só a contagem). Os totais são a soma das linhas. Sem morador, unidade,
        horário ou observação. Não grava nem envia nada.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Vazio = primeiro dia do mês de "to"' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Vazio = hoje; período de até 366 dias' }
      responses:
        '200': { description: '{ data: { condominium_id, from, to, period_days, rows[{ area_id, name, booking_mode, booking_mode_label, area_active, reservations, confirmed, pending, cancelled, fee_cents, days_used, occupancy_pct, units, cancel_pct, by_weekday{ mon..sun } }], totals { areas, reservations, confirmed, pending, cancelled, fee_cents, days_used, cancel_pct, by_weekday } } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/agreement-watch:
    get:
      operationId: agreementWatch
      summary: Acompanhamento dos acordos ativos pela regra de quebra do condomínio (breach_due, late, on_track), somente leitura (erp.agreements.view e erp.entries.view, ADR 0207)
      description: >-
        Mesmo cálculo da quebra do acordo (BillingRules e LateCharges::breach). late traz days_to_breach e
        installments_to_breach. Não marca quebra nem envia aviso: a quebra continua sendo a ação do acordo. Quebrados e
        cancelados ficam de fora. Sem dado de morador.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Vazio = hoje' }
      responses:
        '200': { description: '{ data: { as_of, condominium_id, summary { breach_due, late, on_track: { agreements, open_cents, overdue_cents } }, items[{ agreement_id, condominium_id, condominium_name, unit_id, unit_label, created_on, installments, total_cents, rule, state, overdue_installments, overdue_cents, open_cents, max_days_late, next_due_on, reasons[], days_to_breach, installments_to_breach }], truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/agreements:
    get:
      operationId: reportAgreements
      summary: Relatório de acordos (AP-047) criados no período, com parcelas pagas, em aberto e vencidas (erp.agreements.view)
      description: format=csv baixa a mesma consulta em CSV (BOM UTF-8, separador ;, células iniciadas por = + - @ com apóstrofo).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 'No máximo 366 dias' }
        - { name: status, in: query, schema: { type: string, enum: [active, breached, cancelled] } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: '{ data: { from, to, as_of, agreements[], totals{agreements, total_cents, paid_cents, open_cents, overdue_cents, by_status} } } ou text/csv' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/agreement-fees:
    get:
      operationId: reportAgreementFees
      summary: Taxas de acordos (AP-048) por condomínio, encargos, descontos e encargos líquidos; cancelados só na contagem (erp.agreements.view)
      security: [{ session: [] }]
