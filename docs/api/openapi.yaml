    get:
      operationId: listCollectionContacts
      summary: Contatos de cobrança da unidade, do mais novo ao mais antigo (erp.collections.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data[{ channel, outcome, promise_on, promise_cents, next_action_on, note, open_cents, created_at }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/search:
    get:
      operationId: searchPeople
      summary: Busca proprietários e inquilinos para vincular a unidades (erp.units.view, ADR 0162)
      description: q com no mínimo 3 caracteres. Só dígitos e pontuação = CPF/CNPJ completo (igualdade); o resto = nome (contém), só pessoas com vínculo no escopo. Pessoa de fora do escopo só aparece pelo documento completo, com links vazio. Nunca traz e-mail nem telefone. Até 300 buscas por hora.
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [owner, tenant, any] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses:
        '200': { description: '{ data[{ id, name, document_masked, person_type, links[{ unit_id, unit_label, condominium_slug, condominium_name, role }] }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: Limite de buscas por hora atingido }
  /people/{id}/links:
    post:
      operationId: linkPersonToUnits
      summary: Vincula uma pessoa existente a várias unidades do escopo, sem duplicar (erp.units.view + erp.residents.manage, ADR 0162)
      description: Unidade fora do escopo, inexistente ou inativa = 404 e nada é gravado. Pessoa de fora do escopo exige document igual ao dela (o CPF/CNPJ digitado na busca). Repetir não duplica; o que já existe vem em existing.
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [unit_ids, role], properties: { unit_ids: { type: array, minItems: 1, maxItems: 50, items: { type: integer } }, role: { type: string, enum: [owner, tenant] }, starts_at: { type: string, format: date }, document: { type: string, description: 'CPF/CNPJ da pessoa; obrigatório só quando ela é de fora do escopo' } } } } }
      responses:
        '201': { description: '{ data{ person_id, created[{ id, unit_id }], existing[unit_id] } }' }
        '400': { description: Corpo JSON inválido }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /collection-contacts:
    post:
      operationId: recordCollectionContact
      summary: Registra um contato de cobrança; histórico, não se edita (erp.collections.manage)
      description: Promessa de pagamento exige a data (até 90 dias). Próxima ação até 180 dias. Guarda o valor vencido em aberto no momento.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [unit_id, channel, outcome, note], properties: { unit_id: { type: integer }, channel: { type: string, enum: [phone, email, whatsapp, in_person, letter] }, outcome: { type: string, enum: [promise, negotiating, no_answer, refused, paid_claimed, other] }, note: { type: string, minLength: 5, maxLength: 1000 }, contact_name: { type: string }, promise_on: { type: string, format: date }, promise_cents: { type: string }, next_action_on: { type: string, format: date } } } } }
      responses:
        '201': { description: Contato registrado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /legal-cases:
    get:
      operationId: listLegalCases
      summary: Casos de cobrança judicial (AP-039), só acompanhamento (erp.collections.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: status, in: query, schema: { type: string, enum: [preparing, filed, suspended, agreement, closed] } }
        - { name: include_closed, in: query, schema: { type: boolean } }
      responses:
        '200': { description: '{ data[], total }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: openLegalCase
      summary: Abre o caso judicial da unidade com contas vencidas em aberto, fora de acordo (erp.collections.manage e erp.agreements.view)
      description: Só marca e acompanha. Não envia nada a advogado nem a tribunal e não cria encargo. Um caso aberto por unidade.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [unit_id, entry_ids, note], properties: { unit_id: { type: integer }, entry_ids: { type: array, items: { type: integer }, maxItems: 200 }, lawyer_id: { type: integer }, case_number: { type: string }, court: { type: string }, opened_on: { type: string, format: date }, note: { type: string, minLength: 5, maxLength: 1000 } } } } }
      responses:
        '201': { description: Caso aberto }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A unidade já tem caso aberto }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /legal-cases/{id}:
    get:
      operationId: getLegalCase
      summary: Caso judicial com as contas (valor na abertura e situação atual) e o andamento (erp.collections.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 'Caso com entries[], still_open_cents, events[] e next_statuses' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /legal-cases/{id}/events:
    post:
      operationId: addLegalCaseEvent
      summary: Registra andamento do caso; to_status muda a situação pelas transições permitidas; encerrar exige nota (erp.collections.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 5, maxLength: 1000 }, to_status: { type: string, enum: [filed, suspended, agreement, closed] }, happened_on: { type: string, format: date }, lawyer_id: { type: integer }, case_number: { type: string }, court: { type: string } } } } }
      responses:
        '200': { description: Caso atualizado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Caso encerrado ou transição não permitida }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /inspection-templates:
    get:
      operationId: listInspectionTemplates
      tags: [Inspections]
      summary: Modelos de checklist ativos
      description: Requer erp.inspections.view.
      security: [{ session: [] }]
      responses:
        '200': { description: Modelos }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inspections:
    get:
      operationId: listInspections
      tags: [Inspections]
      summary: Vistorias recentes dos condomínios do usuário
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [in_progress, completed, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Lista }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: startInspection
      tags: [Inspections]
      summary: Check-in (abre a vistoria)
      description: Requer erp.inspections.perform e o condomínio no escopo. Fora do raio ou sem posição exige checkin_note.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominium_id, template_id]
              properties:
                condominium_id: { type: integer }
                template_id: { type: integer }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: number, description: Precisão do GPS em metros }
                checkin_note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Vistoria criada
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Inspection' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { description: CSRF inválido }
        '422':
          description: Dados inválidos ou justificativa ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /inspections/schedule:
    get:
      operationId: inspectionSchedule
      tags: [Inspections]
      summary: Planos ativos com próxima data e situação (overdue, due_soon, in_progress, ok)
      security: [{ session: [] }]
      responses:
        '200': { description: Programação }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inspections/{id}:
    get:
      operationId: getInspection
      tags: [Inspections]
      summary: Uma vistoria com itens e fotos
      description: Fora do escopo responde 404.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Vistoria
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Inspection' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada ou fora do escopo }
  /inspections/{id}/items/{item}:
    put:
      operationId: answerInspectionItem
      tags: [Inspections]
      summary: Responde um item (issue exige note)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [pending, ok, issue, not_applicable] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Vistoria atualizada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada }
        '409': { description: Vistoria concluída ou cancelada }
        '422': { description: Inválido, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /inspections/{id}/items/{item}/photos:
    post:
      operationId: addInspectionPhoto
      tags: [Inspections]
      summary: Envia uma foto do item (JPG, PNG ou WebP até 15 MB; regravada como JPEG sem EXIF)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '201': { description: Foto gravada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada }
        '409': { description: Vistoria concluída ou cancelada }
        '422': { description: Arquivo inválido ou limite de fotos }
  /inspections/{id}/complete:
    post:
      operationId: completeInspection
      tags: [Inspections]
      summary: Conclui a vistoria (todos os itens respondidos e fotos obrigatórias presentes)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { summary: { type: string, maxLength: 4000 } } }
      responses:
        '200': { description: Concluída }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada }
        '409': { description: Já concluída ou cancelada }
        '422': { description: Itens pendentes, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /tickets:
    get:
      operationId: listTickets
      tags: [Tickets]
      summary: Chamados dos condomínios do usuário e os que ele abriu (ADR 0034)
      description: Requer erp.access. Mesma regra da tela /operacional/chamados.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, waiting_customer, resolved, closed] } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Protocolo ou assunto }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Ticket' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: openTicket
      tags: [Tickets]
      summary: Abre um chamado na fila do Help Desk (origem api)
      description: Requer erp.access e, quando informado, o condomínio no escopo. A unidade precisa ser do condomínio. Sem requester_name o solicitante é o próprio usuário.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, minLength: 4, maxLength: 180 }
                message: { type: string, minLength: 10 }
                area: { type: string, enum: [general, technical, financial], default: general }
                priority: { type: string, enum: [low, medium, high, urgent], default: medium }
                category: { type: string, maxLength: 100 }
                condominium_id: { type: integer }
                unit_id: { type: integer }
                requester_name: { type: string, maxLength: 160 }
                requester_email: { type: string, format: email, maxLength: 190 }
                requester_phone: { type: string, maxLength: 30 }
      responses:
        '201': { description: Chamado aberto, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Ticket' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { description: CSRF inválido }
        '422': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /tickets/reassign:
    post:
      operationId: reassignTickets
      summary: Reatribuição em lote dos chamados em aberto de um responsável para outro, no condomínio, tudo ou nada e com prévia (studio.access e support.manage, ADR 0227)
      description: >-
        Sem ticket_ids, entram os chamados em aberto (aberto, em atendimento, aguardando cliente) do condomínio atribuídos
        a from_user_id. Com ticket_ids, recusa chamado não encontrado no condomínio, concluído ou de outro responsável. O
        novo responsável precisa ser da equipe do Help Desk. Só o responsável muda; o histórico do chamado ganha o evento
        assigned_to, e a auditoria um registro reassign por chamado. Nenhum aviso é enviado. Sem protocolo, assunto,
        solicitante ou nome de responsável na resposta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, from_user_id, to_user_id, reason], properties: { condominium_id: { type: integer }, from_user_id: { type: integer }, to_user_id: { type: integer }, reason: { type: string, minLength: 5, maxLength: 255 }, ticket_ids: { type: array, items: { type: integer }, maxItems: 500 }, dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: '{ data: { condominium_id, dry_run, from_user_id, to_user_id, reason, count, changed, tickets[{ id, priority, status, due_at }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Entrada inválida ou chamado recusado (errors com _form e _ticket); nada é gravado' }
  /tickets/{id}:
    get:
      operationId: showTicket
      tags: [Tickets]
      summary: Um chamado visível para o usuário
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Chamado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Ticket' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Não encontrado ou fora do escopo }
  /tickets/{id}/messages:
    get:
      operationId: listTicketMessages
      tags: [Tickets]
      summary: Conversa pública do chamado (sem as notas internas do Help Desk)
      description: ADR 0142. Mesma visibilidade de showTicket. from_team diz se a mensagem veio da equipe ou de quem pediu.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Mensagens em ordem cronológica
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        author: { type: string }
                        from_team: { type: boolean }
                        message: { type: string }
                        internal: { type: boolean }
                        created_at: { type: string }
                        attachments: { type: array, items: { type: object, properties: { name: { type: string }, url: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Não encontrado ou fora do escopo }
    post:
      operationId: replyTicket
      tags: [Tickets]
      summary: Resposta de quem pediu o chamado
      description: ADR 0142. Aguardando cliente volta para atendimento; resolvido ou fechado é reaberto. A equipe (responsável, ou o Help Desk) é avisada.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 2, maxLength: 10000 }
      responses:
        '201':
          description: Mensagem enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message_id: { type: integer }
                      status: { type: string, enum: [open, in_progress, waiting_customer, resolved, closed] }
                      ticket: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Não encontrado ou fora do escopo }
        '419': { description: CSRF inválido }
        '422': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /help/articles:
    get:
      operationId: suggestHelpArticles
      tags: [Tickets]
      summary: Artigos publicados da Central de Ajuda que combinam com o texto (sugestão no formulário de chamado)
      description: ADR 0153. Exige erp.access. Qualquer palavra de 2+ letras (até 6) no título, resumo ou texto; título primeiro, depois os mais vistos. Limite 120 buscas por minuto.
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        '200':
          description: Artigos sugeridos (lista vazia quando nada combina)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        summary: { type: string }
                        category: { type: string }
                        url: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Muitas buscas em pouco tempo }
