openapi: 3.1.0
info:
  title: Connect ERP API
  version: 0.3.0
  description: |
    API REST do Connect ERP sobre o núcleo Organic Code. Administradora única (ADR-002):
    todo dado de condomínio é limitado ao escopo do usuário no servidor.
    Autenticação pela sessão do Organic Code (cookie). Quando o usuário tem 2FA ativo,
    a sessão só é autenticada depois de POST /auth/2fa/verify.
    Métodos que alteram estado exigem o cabeçalho X-CSRF-Token com o token da sessão.
    Os cadastros (proprietários e inquilinos, síndico e conselho, funcionários, fornecedores,
    advogados, veículos, visitantes, animais e contatos úteis) estão em registries.openapi.yaml,
    gerado de Definitions.php por tools/registry-openapi.php (ADR 0014).
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Sessão do Organic Code já elevada pelo segundo fator quando exigido.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthenticated, forbidden, not_found, csrf_invalid, invalid_code, validation_failed] }
            message: { type: string }
    Condominium:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 160 }
        document: { type: [string, 'null'], pattern: '^\d{14}$', description: CNPJ somente dígitos }
        status: { type: string, enum: [active, inactive] }
    Me:
      type: object
      required: [id, name, email, two_factor_enabled, condominiums]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: [object, 'null']
          properties:
            slug: { type: string }
            name: { type: string }
        two_factor_enabled: { type: boolean }
        condominiums:
          type: object
          required: [all, items]
          properties:
            all: { type: boolean, description: Usuário com erp.condominiums.all explícito }
            items:
              type: array
              items: { $ref: '#/components/schemas/Condominium' }
    OnboardingItem:
      type: object
      description: Item do checklist de chegada do condomínio (ADR 0013)
      required: [id, category, title, status, situation]
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: [string, 'null'], description: Código do item no catálogo; null em item avulso }
        custom: { type: boolean }
        category: { type: string, enum: [documentacao, seguranca, manutencao, seguros, financeiro, pessoas] }
        title: { type: string, maxLength: 160 }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, regular, action_required, in_progress, not_applicable] }
        situation:
          type: string
          enum: [pending, regular, action_required, in_progress, not_applicable, expiring, expired, overdue]
          description: Situação calculada na leitura (validade vencida ou a vencer em 30 dias, prazo do protocolo vencido)
        protocol: { type: [string, 'null'], pattern: '^CHK-\d{4}-\d{6}$' }
        due_date: { type: [string, 'null'], format: date }
        expires_at: { type: [string, 'null'], format: date }
        renewal_months: { type: [integer, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        responsible:
          type: [object, 'null']
          properties: { id: { type: integer }, name: { type: string } }
        resolved_at: { type: [string, 'null'] }
        updated_at: { type: string }
    OnboardingSummary:
      type: object
      properties:
        total: { type: integer }
        done: { type: integer, description: Em dia, vencendo ou não se aplica }
        open: { type: integer, description: Protocolos abertos }
        pending: { type: integer, description: Ainda a verificar }
        attention: { type: integer, description: Vencidos, a vencer ou com prazo vencido }
        progress: { type: integer, minimum: 0, maximum: 100 }
        by_situation: { type: object, additionalProperties: { type: integer } }
  responses:
    Unauthenticated:
      description: Sessão ausente ou ainda sem o segundo fator
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Sem permissão
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Não encontrado ou fora do escopo
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CsrfInvalid:
      description: X-CSRF-Token ausente ou inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: Dados inválidos; error.fields traz campo → mensagem
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verifica aplicação e MariaDB
      security: []
      responses:
        '200': { description: Serviço pronto }
        '503': { description: Dependência indisponível }
  /auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Conclui um login pendente com código TOTP ou de recuperação
      description: Exige um login com senha válida feito antes nesta sessão. Limite de 6 tentativas a cada 5 minutos e 5 por desafio.
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: '6 dígitos TOTP ou código de recuperação xxxxx-xxxxx' }
      responses:
        '200':
          description: Sessão autenticada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { authenticated: { const: true } } }
        '409':
          description: Não há verificação pendente
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '419':
          description: Token CSRF ausente ou inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Código inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Muitas tentativas
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /me:
    get:
      operationId: getMe
      summary: Usuário autenticado, papel, 2FA e condomínios permitidos
      security: [{ session: [] }]
      responses:
        '200':
          description: Usuário atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /condominiums:
    get:
      operationId: listCondominiums
      summary: Condomínios ativos dentro do escopo do usuário
      description: Requer erp.condominiums.view. Retorna só os vinculados ao usuário, ou todos com erp.condominiums.all explícito.
      security: [{ session: [] }]
      responses:
        '200':
          description: Lista de condomínios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Condominium' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /condominiums/{id}:
    get:
      operationId: getCondominium
      summary: Um condomínio do escopo do usuário
      description: Fora do escopo responde 404 para não revelar a existência do registro; a negação é registrada em log.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Condomínio
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Condominium' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /condominiums/{id}/onboarding:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getCondominiumOnboarding
      summary: Checklist de chegada do condomínio
      description: Requer erp.access e erp.condominiums.view. Itens na ordem do catálogo e resumo.
      security: [{ session: [] }]
      responses:
        '200':
          description: Itens e resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/OnboardingItem' } }
                      summary: { $ref: '#/components/schemas/OnboardingSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: startCondominiumOnboarding
      summary: Inicia ou atualiza o checklist com os itens ativos do catálogo
      description: Requer erp.condominiums.manage. Idempotente; 201 quando criou itens, 200 quando nada mudou.
      security: [{ session: [] }]
      responses:
        '200': { description: Nada a criar }
        '201': { description: Itens criados }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /condominiums/{id}/onboarding/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: addCondominiumOnboardingItem
      summary: Registra pendência avulsa (já nasce com protocolo)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, title]
              properties:
                category: { type: string, enum: [documentacao, seguranca, manutencao, seguros, financeiro, pessoas] }
                title: { type: string, maxLength: 160 }
      responses:
        '201':
          description: Item criado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /condominiums/{id}/onboarding/items/{item}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: item, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateCondominiumOnboardingItem
      summary: Atualiza situação, prazo, validade, observações ou responsável
      description: |
        action_required ou in_progress geram protocolo (uma vez) e prazo padrão do item quando due_date
        não é enviado. regular sem expires_at usa a periodicidade de renovação do catálogo.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, regular, action_required, in_progress, not_applicable] }
                due_date: { type: [string, 'null'], format: date }
                expires_at: { type: [string, 'null'], format: date }
                notes: { type: [string, 'null'], maxLength: 2000 }
                responsible_user_id: { type: [integer, 'null'] }
      responses:
        '200':
          description: Item atualizado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
