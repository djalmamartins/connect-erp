openapi: 3.1.0
info:
  title: Connect ERP API
  version: 0.5.0
  description: |
    API REST do Connect ERP sobre o núcleo Organic Code. Administradora única (ADR-002):
    todo dado de condomínio é limitado ao escopo do usuário no servidor.
    Autenticação pela sessão do Organic Code (cookie). Quando o usuário tem 2FA ativo,
    a sessão só é autenticada depois de POST /auth/2fa/verify.
    Métodos que alteram estado exigem o cabeçalho X-CSRF-Token com o token da sessão.
    Os cadastros (proprietários e inquilinos, síndico e conselho, funcionários, fornecedores,
    advogados, veículos, visitantes, animais e contatos úteis) estão em registries.openapi.yaml,
    gerado de Definitions.php por tools/registry-openapi.php (ADR 0014).
servers:
  - url: /api/v1
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: Sessão do Organic Code já elevada pelo segundo fator quando exigido.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Ticket:
      type: object
      description: Chamado do Help Desk (ADR 0034)
      properties:
        id: { type: integer }
        protocol: { type: string, example: CH261109A1B2 }
        subject: { type: string }
        message: { type: string }
        area: { type: string, enum: [general, technical, financial] }
        origin: { type: string, enum: [helpdesk, erp, site, residents, api] }
        category: { type: string, nullable: true }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in_progress, waiting_customer, resolved, closed] }
        condominium: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        unit: { type: object, nullable: true, properties: { id: { type: integer }, label: { type: string } } }
        requester: { type: object, properties: { user_id: { type: integer, nullable: true }, name: { type: string, nullable: true }, email: { type: string, nullable: true }, phone: { type: string, nullable: true } } }
        assigned_to: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        due_at: { type: string }
        resolved_at: { type: string, nullable: true }
        created_at: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthenticated, forbidden, not_found, csrf_invalid, invalid_code, validation_failed] }
            message: { type: string }
    MonthClosingRecord:
      type: object
      description: Fechamento gravado (foto dos totais no momento do fechamento, ADR 0031)
      properties:
        id: { type: integer }
        condominium_id: { type: integer }
        competence: { type: string }
        status: { type: string, enum: [closed, reopened] }
        revenue_cents: { type: integer }
        expense_cents: { type: integer }
        open_revenue_cents: { type: integer }
        open_expense_cents: { type: integer }
        summary: { type: [object, "null"] }
        closed_by: { type: [integer, "null"] }
        closed_at: { type: [string, "null"] }
        reopened_by: { type: [integer, "null"] }
        reopened_at: { type: [string, "null"] }
        reopen_reason: { type: [string, "null"] }
    BankReturnFile:
      type: object
      description: Arquivo de retorno importado (ADR 0035). applied = conciliados; divergence = fila de revisão; other = repetidos.
      properties:
        id: { type: integer }
        condominium_id: { type: integer }
        condominium_name: { type: string }
        bank_account_id: { type: integer }
        bank_account_name: { type: string }
        adapter: { type: string, example: sandbox }
        filename: { type: string }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        events_count: { type: integer }
        applied_count: { type: integer }
        divergence_count: { type: integer }
        other_count: { type: integer }
        total_cents: { type: integer }
        created_at: { type: string, description: Data da importação }
    BankCharge:
      type: object
      description: Boleto (ADR 0035). No sandbox, digitable_line e barcode começam com SANDBOX e não são pagáveis.
      properties:
        id: { type: integer }
        condominium_id: { type: integer }
        bank_account_id: { type: integer }
        entry_id: { type: integer }
        adapter: { type: string, example: sandbox }
        status: { type: string, enum: [pending, registered, rejected, paid, cancelled] }
        status_label: { type: string }
        our_number: { type: string, example: '0000000001' }
        amount_cents: { type: integer }
        due_on: { type: string, format: date }
        external_id: { type: [string, "null"] }
        digitable_line: { type: [string, "null"] }
        barcode: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
        paid_cents: { type: [integer, "null"] }
        paid_on: { type: [string, "null"] }
        registered_at: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"] }
    Invoice:
      type: object
      description: Fatura (ADR 0033). items só vem no detalhe e nas respostas de gravação.
      properties:
        id: { type: integer }
        condominium_id: { type: integer }
        condominium_name: { type: [string, "null"] }
        invoice_type_id: { type: integer }
        type_name: { type: [string, "null"] }
        competence: { type: string, example: '2026-11' }
        due_on: { type: string, format: date }
        status: { type: string, enum: [draft, issued, cancelled] }
        status_label: { type: string }
        units_count: { type: integer }
        amount_cents: { type: integer }
        notes: { type: [string, "null"] }
        issued_at: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"] }
        cancel_reason: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              unit_id: { type: integer }
              unit_label: { type: string }
              amount_cents: { type: integer }
              entry_id: { type: [integer, "null"], description: 'Conta a receber gerada na emissão' }
              paid_on: { type: [string, "null"] }
              entry_status: { type: [string, "null"], enum: [active, inactive, null] }
    MonthClosingStatus:
      type: object
      properties:
        condominium_id: { type: integer }
        competence: { type: string }
        status: { type: string, enum: [open, closed, reopened] }
        closing: { oneOf: [{ $ref: '#/components/schemas/MonthClosingRecord' }, { type: 'null' }] }
        summary:
          type: object
          description: Calculado agora a partir dos lançamentos válidos da competência
          properties:
            revenue_cents: { type: integer }
            expense_cents: { type: integer }
            open_revenue_cents: { type: integer }
            open_expense_cents: { type: integer }
            result_cents: { type: integer, description: Receitas menos despesas; pode ser negativo }
            entries: { type: integer }
            by_account: { type: array, items: { type: object } }
            by_bank_account: { type: array, items: { type: object } }
    Condominium:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 160 }
        document: { type: [string, 'null'], pattern: '^\d{14}$', description: CNPJ somente dígitos }
        status: { type: string, enum: [active, inactive] }
    Me:
      type: object
      required: [id, name, email, two_factor_enabled, condominiums]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: [object, 'null']
          properties:
            slug: { type: string }
            name: { type: string }
        two_factor_enabled: { type: boolean }
        condominiums:
          type: object
          required: [all, items]
          properties:
            all: { type: boolean, description: Usuário com erp.condominiums.all explícito }
            items:
              type: array
              items: { $ref: '#/components/schemas/Condominium' }
    OnboardingItem:
      type: object
      description: Item do checklist de chegada do condomínio (ADR 0013)
      required: [id, category, title, status, situation]
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: [string, 'null'], description: Código do item no catálogo; null em item avulso }
        custom: { type: boolean }
        category: { type: string, enum: [documentacao, seguranca, manutencao, seguros, financeiro, pessoas] }
        title: { type: string, maxLength: 160 }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, regular, action_required, in_progress, not_applicable] }
        situation:
          type: string
          enum: [pending, regular, action_required, in_progress, not_applicable, expiring, expired, overdue]
          description: Situação calculada na leitura (validade vencida ou a vencer em 30 dias, prazo do protocolo vencido)
        protocol: { type: [string, 'null'], pattern: '^CHK-\d{4}-\d{6}$' }
        due_date: { type: [string, 'null'], format: date }
        expires_at: { type: [string, 'null'], format: date }
        renewal_months: { type: [integer, 'null'] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        responsible:
          type: [object, 'null']
          properties: { id: { type: integer }, name: { type: string } }
        resolved_at: { type: [string, 'null'] }
        alerted_situation: { type: [string, 'null'], description: Última situação já avisada pelo job diário }
        updated_at: { type: string }
    OnboardingTemplate:
      type: object
      required: [id, code, category, title, default_due_days, active]
      properties:
        id: { type: integer }
        code: { type: string, pattern: '^[a-z0-9_]{2,60}$', description: Imutável depois de criado }
        category: { type: string, enum: [documentacao, seguranca, manutencao, seguros, financeiro, pessoas] }
        title: { type: string, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 500 }
        default_due_days: { type: integer, minimum: 1, maximum: 365 }
        renewal_months: { type: [integer, 'null'], minimum: 1, maximum: 120 }
        position: { type: integer, minimum: 0, maximum: 999 }
        active: { type: boolean }
        usage_count: { type: integer, readOnly: true }
    OnboardingSummary:
      type: object
      properties:
        total: { type: integer }
        done: { type: integer, description: Em dia, vencendo ou não se aplica }
        open: { type: integer, description: Protocolos abertos }
        pending: { type: integer, description: Ainda a verificar }
        attention: { type: integer, description: Vencidos, a vencer ou com prazo vencido }
        progress: { type: integer, minimum: 0, maximum: 100 }
        by_situation: { type: object, additionalProperties: { type: integer } }
    InspectionItem:
      type: object
      required: [id, section, label, requires_photo, result]
      properties:
        id: { type: integer }
        position: { type: integer }
        section: { type: string }
        label: { type: string }
        requires_photo: { type: boolean }
        result: { type: string, enum: [pending, ok, issue, not_applicable] }
        note: { type: [string, 'null'] }
        answered_at: { type: [string, 'null'] }
        photos:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              width: { type: integer }
              height: { type: integer }
              latitude: { type: [number, 'null'] }
              longitude: { type: [number, 'null'] }
              url: { type: string, description: Rota autorizada do ERP que serve a foto }
    Inspection:
      type: object
      required: [id, condominium_id, status, checkin, items]
      properties:
        id: { type: integer }
        condominium_id: { type: integer }
        condominium: { type: string }
        template_id: { type: integer }
        template: { type: string }
        inspector: { type: string }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        checkin:
          type: object
          properties:
            at: { type: string }
            status: { type: string, enum: [inside, outside, no_reference, no_signal] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
            accuracy_m: { type: [number, 'null'] }
            distance_m: { type: [number, 'null'] }
            note: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        completed_at: { type: [string, 'null'] }
        counts: { type: object, additionalProperties: { type: integer } }
        editable: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/InspectionItem' } }
    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { const: validation_failed }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
  responses:
    Unauthenticated:
      description: Sessão ausente ou ainda sem o segundo fator
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Sem permissão
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Não encontrado ou fora do escopo
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CsrfInvalid:
      description: X-CSRF-Token ausente ou inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: Dados inválidos; error.fields traz campo → mensagem
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verifica aplicação e MariaDB
      security: []
      responses:
        '200': { description: Serviço pronto }
        '503': { description: Dependência indisponível }
  /auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Conclui um login pendente com código TOTP ou de recuperação
      description: Exige um login com senha válida feito antes nesta sessão. Limite de 6 tentativas a cada 5 minutos e 5 por desafio.
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: '6 dígitos TOTP ou código de recuperação xxxxx-xxxxx' }
      responses:
        '200':
          description: Sessão autenticada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { authenticated: { const: true } } }
        '409':
          description: Não há verificação pendente
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '419':
          description: Token CSRF ausente ou inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Código inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Muitas tentativas
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /users/{id}/2fa:
    delete:
      operationId: resetUserTwoFactor
      summary: Redefine (remove) o 2FA de outro usuário
      description: >-
        Exige security.2fa.manage. Não vale para o próprio usuário (use a tela de segurança) nem para
        alvo com nível maior que o de quem pede. Remove segredo e códigos de recuperação e grava
        auditoria (ADR 0025). No próximo login o usuário cadastra o autenticador de novo.
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 2FA removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { user_id: { type: integer }, two_factor_enabled: { const: false } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: O usuário não tem 2FA ativo
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422':
          description: Pedido para o próprio usuário (self_reset)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Muitas tentativas
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /me:
    get:
      operationId: getMe
      summary: Usuário autenticado, papel, 2FA e condomínios permitidos
      security: [{ session: [] }]
      responses:
        '200':
          description: Usuário atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /condominiums:
    get:
      operationId: listCondominiums
      summary: Condomínios ativos dentro do escopo do usuário
      description: Requer erp.condominiums.view. Retorna só os vinculados ao usuário, ou todos com erp.condominiums.all explícito.
      security: [{ session: [] }]
      responses:
        '200':
          description: Lista de condomínios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Condominium' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /condominiums/{id}:
    get:
      operationId: getCondominium
      summary: Um condomínio do escopo do usuário
      description: Fora do escopo responde 404 para não revelar a existência do registro; a negação é registrada em log.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Condomínio
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Condominium' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /condominiums/{id}/onboarding:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getCondominiumOnboarding
      summary: Checklist de chegada do condomínio
      description: Requer erp.access e erp.condominiums.view. Itens na ordem do catálogo e resumo.
      security: [{ session: [] }]
      responses:
        '200':
          description: Itens e resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/OnboardingItem' } }
                      summary: { $ref: '#/components/schemas/OnboardingSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: startCondominiumOnboarding
      summary: Inicia ou atualiza o checklist com os itens ativos do catálogo
      description: Requer erp.condominiums.manage. Idempotente; 201 quando criou itens, 200 quando nada mudou.
      security: [{ session: [] }]
      responses:
        '200': { description: Nada a criar }
        '201': { description: Itens criados }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /condominiums/{id}/onboarding/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: addCondominiumOnboardingItem
      summary: Registra pendência avulsa (já nasce com protocolo)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, title]
              properties:
                category: { type: string, enum: [documentacao, seguranca, manutencao, seguros, financeiro, pessoas] }
                title: { type: string, maxLength: 160 }
      responses:
        '201':
          description: Item criado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /condominiums/{id}/onboarding/items/{item}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { name: item, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateCondominiumOnboardingItem
      summary: Atualiza situação, prazo, validade, observações ou responsável
      description: |
        action_required ou in_progress geram protocolo (uma vez) e prazo padrão do item quando due_date
        não é enviado. regular sem expires_at usa a periodicidade de renovação do catálogo.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, regular, action_required, in_progress, not_applicable] }
                due_date: { type: [string, 'null'], format: date }
                expires_at: { type: [string, 'null'], format: date }
                notes: { type: [string, 'null'], maxLength: 2000 }
                responsible_user_id: { type: [integer, 'null'] }
      responses:
        '200':
          description: Item atualizado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /onboarding/templates:
    get:
      operationId: listOnboardingTemplates
      summary: Catálogo do checklist de chegada
      description: Requer erp.access e erp.onboarding.catalog.
      security: [{ session: [] }]
      responses:
        '200':
          description: Itens do catálogo
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OnboardingTemplate' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOnboardingTemplate
      summary: Inclui item no catálogo (ativo por padrão)
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingTemplate' } } }
      responses:
        '201':
          description: Criado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingTemplate' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /onboarding/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateOnboardingTemplate
      summary: Altera item do catálogo (campos ausentes mantêm o valor; code é ignorado)
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingTemplate' } } }
      responses:
        '200':
          description: Atualizado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OnboardingTemplate' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /bank-accounts/balances:
    get:
      operationId: listBankAccountBalances
      summary: Saldo calculado de cada conta bancária do escopo (ADR 0024)
      description: |
        Saldo inicial + receitas pagas − despesas pagas, só com lançamentos válidos e pagos a partir
        da data do saldo inicial. Exige erp.bank_accounts.view e erp.entries.view. Somente leitura.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        condominium_id: { type: integer }
                        condominium_name: { type: [string, "null"] }
                        name: { type: string }
                        is_main: { type: boolean }
                        opening_cents: { type: integer }
                        opened_on: { type: [string, "null"], format: date }
                        received_cents: { type: integer }
                        paid_cents: { type: integer }
                        balance_cents: { type: integer, description: Pode ser negativo }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /recurring-entries/generate:
    post:
      operationId: generateRecurringEntries
      summary: Gera os lançamentos de uma competência a partir dos lançamentos fixos (ADR 0027)
      description: |
        Idempotente: repetir a chamada para a mesma competência não duplica (modelos já gerados
        voltam em skipped). Exige erp.recurring_entries.manage e erp.entries.manage.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competence]
              properties:
                competence: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-11'] }
                condominium_id: { type: [integer, "null"], minimum: 1 }
      responses:
        '200':
          description: Resultado da geração
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      competence: { type: string }
                      created: { type: array, items: { type: integer }, description: IDs dos lançamentos criados }
                      skipped: { type: array, items: { type: integer }, description: IDs dos modelos já gerados nesta competência }
                      failed: { type: object, additionalProperties: { type: object, additionalProperties: { type: string } }, description: Erros por modelo }
        '400': { description: JSON inválido }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /closings:
    get:
      operationId: getMonthClosing
      summary: Resumo calculado e situação do fechamento de uma competência (ADR 0031)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: competence, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Situação (open, closed ou reopened), fechamento gravado e resumo atual
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MonthClosingStatus' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: closeMonth
      summary: Fecha a competência e trava os lançamentos dela (erp.closing.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, competence], properties: { condominium_id: { type: integer }, competence: { type: string } } } } }
      responses:
        '200': { description: Fechada, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MonthClosingRecord' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Competência já fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /closings/reopen:
    post:
      operationId: reopenMonth
      summary: Reabre a competência fechada, com motivo (erp.closing.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, competence, reason], properties: { condominium_id: { type: integer }, competence: { type: string }, reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Reaberta, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MonthClosingRecord' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Competência não está fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /invoices:
    get:
      operationId: listInvoices
      summary: Faturas dos condomínios do escopo (erp.invoices.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: competence, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: status, in: query, schema: { type: string, enum: [draft, issued, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página)', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }, total: { type: integer }, page: { type: integer }, per_page: { type: integer }, pages: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: prepareInvoice
      summary: Prepara a fatura (rascunho) com um item por unidade ativa (erp.invoices.manage)
      description: >-
        method fixed = amount_cents por unidade; fraction = amount_cents total rateado pela fração
        ideal (sobra de centavos para as maiores frações). Sem amount_cents, usa o valor padrão do
        tipo. Uma fatura ativa por condomínio, tipo e competência.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, invoice_type_id, competence, due_on], properties: { condominium_id: { type: integer }, invoice_type_id: { type: integer }, competence: { type: string }, due_on: { type: string, format: date }, method: { type: string, enum: [fixed, fraction], default: fixed }, amount_cents: { oneOf: [{ type: integer, minimum: 1 }, { type: string, example: '1.250,00' }] }, notes: { type: string, maxLength: 255 } } } } }
      responses:
        '201': { description: Rascunho criado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Já existe fatura ativa do tipo na competência, ou competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /invoices/{id}:
    get:
      operationId: showInvoice
      summary: Fatura com os itens por unidade e a situação de cada conta a receber
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Fatura, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}/items/{item}:
    patch:
      operationId: updateInvoiceItem
      summary: Ajusta o valor de uma unidade na fatura em preparação (erp.invoices.manage)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount_cents], properties: { amount_cents: { oneOf: [{ type: integer, minimum: 1 }, { type: string }] } } } } }
      responses:
        '200': { description: Fatura atualizada, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Fatura não está em preparação }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /invoices/{id}/issue:
    post:
      operationId: issueInvoice
      summary: Emite a fatura; cada item vira uma conta a receber da unidade (erp.invoices.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Emitida, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Não está em preparação, já emitida ou competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Um lançamento não passou nas regras (fields)' }
  /invoices/{id}/cancel:
    post:
      operationId: cancelInvoice
      summary: Cancela a fatura com motivo; emitida cancela as contas a receber geradas (erp.invoices.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelada, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Já cancelada, conta a receber paga ou competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /bank-charges:
    get:
      operationId: listBankCharges
      summary: Boletos dos condomínios do escopo (erp.bank_charges.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: status, in: query, schema: { type: string, enum: [pending, registered, rejected, paid, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página)', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/BankCharge' } }, total: { type: integer }, page: { type: integer }, per_page: { type: integer }, pages: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: issueBankCharge
      summary: Emite o boleto de uma conta a receber pelo adaptador sandbox (erp.bank_charges.manage)
      description: >-
        Idempotente por lançamento: com título ativo (pending, registered ou paid), devolve o mesmo.
        Sem confirmação do banco, o título fica pending e é verificável em /refresh.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [entry_id, bank_account_id], properties: { entry_id: { type: integer }, bank_account_id: { type: integer } } } } }
      responses:
        '201': { description: Título (novo ou o já existente), content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BankCharge' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Conta a receber já paga }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bank-charges/{id}:
    get:
      operationId: showBankCharge
      summary: Boleto
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Boleto, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BankCharge' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bank-charges/{id}/refresh:
    post:
      operationId: refreshBankCharge
      summary: Consulta o título no banco e grava a resposta (erp.bank_charges.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Boleto atualizado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BankCharge' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /bank-charges/{id}/cancel:
    post:
      operationId: cancelBankCharge
      summary: Cancela o boleto aguardando banco ou registrado (erp.bank_charges.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Cancelado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BankCharge' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Pago, recusado, já cancelado ou cancelamento não confirmado pelo banco' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /bank-returns:
    get:
      operationId: listBankReturns
      summary: Arquivos de retorno importados, mais recentes primeiro (erp.bank_charges.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo; fora do escopo = lista vazia' }
        - { name: bank_account_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página)', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/BankReturnFile' } }, total: { type: integer }, page: { type: integer }, per_page: { type: integer }, pages: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: importBankReturn
      summary: Importa um arquivo de retorno do sandbox e concilia (erp.bank_charges.manage)
      description: >-
        content é o texto do arquivo (UTF-8, até 2 MB) no formato SANDBOX-RETORNO;v1 (não é CNAB).
        Layout, trailer ou totais inválidos recusam o arquivo inteiro (422). O mesmo arquivo
        devolve duplicate_file true sem reprocessar; evento repetido é ignorado. Pagamento só dá
        baixa com valor igual ao do título; o resto vai para a fila de divergências.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [bank_account_id, content], properties: { bank_account_id: { type: integer }, filename: { type: string, maxLength: 120 }, content: { type: string } } } } }
      responses:
        '201': { description: 'Arquivo processado: { file, duplicate_file, events[] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bank-events/divergences:
    get:
      operationId: listBankDivergences
      summary: Fila de revisão (divergência ou título não encontrado, não resolvidos)
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer } }]
      responses:
        '200': { description: Eventos para revisar (até 200) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bank-events/{id}/resolve:
    post:
      operationId: resolveBankDivergence
      summary: Marca a divergência como revisada, com nota (erp.bank_charges.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Resolvida }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Já resolvida }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /reports/trial-balance:
    get:
      operationId: trialBalance
      summary: Balancete de verificação por competência (erp.entries.view e erp.chart.view)
      description: >-
        Por conta do plano de contas: previsto (lançamentos da competência), realizado (pagos) e em
        aberto; as analíticas somam nas sintéticas pelo código. Lançamentos válidos apenas.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, example: '2026-01' } }
        - { name: to, in: query, required: true, schema: { type: string, example: '2026-12' }, description: 'No máximo 24 competências' }
      responses:
        '200': { description: '{ data: { rows[{code, name, nature, level, analytic, planned_cents, realized_cents, open_cents}], totals } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/statement:
    get:
      operationId: financialStatement
      summary: Prestação de contas por caixa, com conciliação por conta bancária (erp.entries.view e erp.chart.view)
      description: >-
        accounts = recebido e pago no período por conta do plano; banks = saldo anterior, entradas,
        saídas e saldo final de cada conta bancária; totals.reconciled diz se o caixa pelo plano é
        igual ao caixa pelos bancos (difference_cents mostra a diferença, nunca é escondida).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: 'No máximo 366 dias' }
      responses:
        '200': { description: '{ data: { accounts[], banks[], totals{received_cents, paid_cents, result_cents, bank_net_cents, difference_cents, reconciled} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /delinquency:
    get:
      operationId: listDelinquency
      summary: Contas a receber vencidas e em aberto por unidade (erp.agreements.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Data de referência; padrão hoje. Vence no dia = ainda não vencida.' }
      responses:
        '200': { description: '{ data: { as_of, units[{unit_id, unit_label, entries[{id, due_on, amount_cents, days_late, bucket}], amount_cents, max_days_late}], totals{units, entries, amount_cents, buckets{1-30, 31-60, 61-90, 90+}} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements:
    get:
      operationId: listAgreements
      summary: Acordos dos condomínios do escopo, com o andamento das parcelas
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página); cada acordo traz paid_installments, paid_cents, open_cents e settled' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAgreement
      summary: Acordo das contas vencidas de uma unidade (erp.agreements.manage)
      description: >-
        As contas escolhidas (da mesma unidade, em aberto, fora de acordo, sem boleto ativo e de
        competência aberta) ficam canceladas e ligadas ao acordo; as parcelas mensais viram contas a
        receber novas na conta de receita informada. total = original + fees − discount; a sobra de
        centavos vai para a primeira parcela. Multa e juros são informados, não calculados.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [unit_id, entry_ids, installments, first_due_on, chart_account_id], properties: { unit_id: { type: integer }, entry_ids: { type: array, items: { type: integer } }, installments: { type: integer, minimum: 1, maximum: 60 }, first_due_on: { type: string, format: date }, chart_account_id: { type: integer }, fees_cents: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }, discount_cents: { oneOf: [{ type: integer, minimum: 0 }, { type: string }] }, notes: { type: string, maxLength: 255 } } } } }
      responses:
        '201': { description: 'Acordo com originals[] e parcels[]' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Conta já paga, em outro acordo, com boleto ativo ou de competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements/{id}:
    get:
      operationId: showAgreement
      summary: Acordo com as contas renegociadas e as parcelas
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Acordo }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agreements/{id}/cancel:
    post:
      operationId: cancelAgreement
      summary: Cancela o acordo sem parcela paga; as contas originais voltam a valer (erp.agreements.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Já cancelado, parcela paga, boleto ativo em parcela ou competência fechada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements/suggestion:
    get:
      operationId: suggestAgreementCharges
      summary: Encargos sugeridos (correção, multa e juros) das contas escolhidas de uma unidade (erp.agreements.view)
      description: >-
        Pela regra do condomínio (ADR 0040). Mês sem índice entra como zero e aparece em
        missing_index. A sugestão vai como fees_cents no POST /agreements e pode ser mudada.
      security: [{ session: [] }]
      parameters:
        - { name: unit_id, in: query, required: true, schema: { type: integer } }
        - { name: entry_ids, in: query, required: true, schema: { type: string, example: '12,13' } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: '{ data: { rule, entries[{entry_id, days_late, correction_cents, fine_cents, interest_cents, charges_cents}], original_cents, correction_cents, fine_cents, interest_cents, fees_cents, total_cents, missing_index[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Conta paga, em acordo, com boleto ativo ou de competência fechada' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /agreements/{id}/breach:
    post:
      operationId: breachAgreement
      summary: Grava a quebra do acordo, com motivo, quando a regra do condomínio indica (erp.agreements.manage)
      description: As parcelas não mudam. A situação calculada aparece em breach no GET do acordo.
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: 'Acordo com status breached' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Acordo não ativo ou fora da regra de quebra' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /billing-rules:
    get:
      operationId: showBillingRule
      summary: Regra de cobrança que vale para o condomínio (própria ou o padrão da Connect) (erp.billing_rules.view)
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = padrão da Connect' }]
      responses:
        '200': { description: '{ data: { fine_bp, monthly_interest_bp, price_index, breach_days_late, breach_open_installments, source: condominium|default|builtin } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveBillingRule
      summary: Grava a regra do condomínio, ou o padrão sem condominium_id (só com acesso a todos) (erp.billing_rules.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { condominium_id: { type: [integer, "null"] }, fine_bp: { type: integer, minimum: 0, maximum: 1000, example: 200 }, monthly_interest_bp: { type: integer, minimum: 0, maximum: 1000, example: 100 }, price_index: { type: string, enum: [IPCA, NONE] }, breach_days_late: { type: integer, minimum: 1, maximum: 365 }, breach_open_installments: { type: integer, minimum: 0, maximum: 60 } } } } }
      responses:
        '200': { description: Regra gravada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /price-indexes:
    get:
      operationId: listPriceIndexes
      summary: Variação mensal do índice (últimos 240 meses) (erp.billing_rules.view)
      security: [{ session: [] }]
      parameters: [{ name: code, in: query, schema: { type: string, enum: [IPCA], default: IPCA } }]
      responses:
        '200': { description: '{ data: [{ competence, rate_percent }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: setPriceIndex
      summary: Lança (ou corrige) a variação de um mês; exige acesso a todos os condomínios (erp.billing_rules.manage)
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [competence, rate_percent], properties: { code: { type: string, enum: [IPCA] }, competence: { type: string, example: '2026-10' }, rate_percent: { oneOf: [{ type: number }, { type: string, example: '0,44' }] } } } } }
      responses:
        '200': { description: '{ data: { code, saved } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /price-indexes/import:
    post:
      operationId: importPriceIndexes
      summary: Importa um arquivo de índices (uma linha AAAA-MM;variação por mês), sem rede (erp.billing_rules.manage)
      description: O arquivo inteiro é validado antes de gravar; mês já lançado é substituído.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content], properties: { code: { type: string, enum: [IPCA] }, content: { type: string, example: "2026-09;0,48\n2026-10;0,44" } } } } }
      responses:
        '200': { description: '{ data: { code, saved } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-documents:
    get:
      operationId: listUnitDocuments
      summary: Documentos da unidade emitidos (erp.unit_documents.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: unit_id, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [debt_certificate, delinquency_declaration, quittance, consent_letter, receipt] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (25 por página), sem o conteúdo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: issueUnitDocument
      summary: Emite certidão de débitos, declaração de inadimplência, quitação, carta de anuência ou recibo (erp.unit_documents.manage)
      description: >-
        debt_certificate sempre emite (result clear = nada consta). delinquency_declaration exige conta
        vencida em aberto. quittance exige until_competence e todas as contas até ela pagas.
        consent_letter exige não haver conta vencida e uma finalidade (purpose). receipt (AP-040, ADR 0057)
        exige entry_ids de contas a receber pagas da unidade, sem recibo válido. O conteúdo fica
        gravado com código de verificação.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind, unit_id], properties: { kind: { type: string, enum: [debt_certificate, delinquency_declaration, quittance, consent_letter, receipt] }, unit_id: { type: integer }, as_of: { type: string, format: date, description: 'Padrão hoje; não pode ser futura' }, until_competence: { type: string, example: '2026-10' }, purpose: { type: string, minLength: 5, maxLength: 40 }, entry_ids: { type: array, maxItems: 60, items: { type: integer }, description: 'Recibo: contas pagas cobertas' } } } } }
      responses:
        '201': { description: 'Documento com content, verification_code e verification_display' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Documento não cabe na situação da unidade (ex.: quitação com conta em aberto)' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /unit-documents/verify/{code}:
    get:
      operationId: verifyUnitDocument
      summary: Confere a autenticidade pelo código (com ou sem hífens)
      security: [{ session: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string, example: 'ABCD-EFGH-JKMN-PQRS' } }]
      responses:
        '200': { description: 'Documento (mostra se foi cancelado)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /unit-documents/{id}:
    get:
      operationId: showUnitDocument
      summary: Documento com o conteúdo gravado na emissão
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Documento }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /unit-documents/{id}/cancel:
    post:
      operationId: cancelUnitDocument
      summary: Cancela o documento, com motivo (erp.unit_documents.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Já cancelado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /meter-readings:
    get:
      operationId: listMeterReadings
      summary: Leituras com consumo e valor (erp.meter_readings.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: competence, in: query, schema: { type: string, example: '2026-11' } }
        - { name: kind, in: query, schema: { type: string, enum: [agua, gas, energia] } }
      responses:
        '200': { description: '{ data: [{ meter_id, unit_label, kind, competence, previous_reading, reading, consumption, amount_cents, tariff_valid_from, billed }], total, totals: { consumption, amount_cents } } (até 500)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: recordMeterReading
      summary: Lança ou corrige a leitura do relógio na competência (erp.meter_readings.manage)
      description: >-
        Consumo = leitura − anterior (competência anterior ou leitura inicial do relógio); leitura menor
        é recusada. Valor pelas faixas progressivas vigentes na data da leitura (do condomínio ou o
        padrão da Connect). Corrigir só vale sem cobrança e sem leitura posterior.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [meter_id, competence, reading], properties: { meter_id: { type: integer }, competence: { type: string }, reading: { oneOf: [{ type: number, minimum: 0 }, { type: string, example: '123,456' }] }, read_on: { type: string, format: date, description: 'Padrão hoje; não pode ser futura' } } } } }
      responses:
        '201': { description: Leitura com consumo e valor }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Leitura já cobrada ou há leitura posterior' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /meter-readings/bill:
    post:
      operationId: billMeterReadings
      summary: Gera uma conta a receber por unidade com o consumo da competência (erp.meter_readings.manage)
      description: Só leituras com valor e ainda não cobradas; tudo ou nada; cobrar de novo não duplica.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, competence, kind, chart_account_id, due_on], properties: { condominium_id: { type: integer }, competence: { type: string }, kind: { type: string, enum: [agua, gas, energia] }, chart_account_id: { type: integer, description: 'Conta analítica de receita' }, due_on: { type: string, format: date } } } } }
      responses:
        '200': { description: '{ data: { competence, kind, created: [entry_id], skipped } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Cobrada em paralelo }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Dados inválidos ou um lançamento fora das regras (fields), ex.: competência fechada' }
  /documents:
    get:
      operationId: listVirtualDisk
      summary: Arquivos do Disco Virtual (erp.documents.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: folder, in: query, schema: { type: string, enum: [atas, contratos, plantas, notas_fiscais, outros] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Título ou nome do arquivo }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Lista paginada (50 por página): id, folder, title, original_name, mime, size_bytes, sha256, uploaded_at' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: uploadVirtualDisk
      summary: Envia um arquivo (erp.documents.manage)
      description: >-
        Tipo conferido pelo conteúdo, com extensão correspondente: PDF, JPG, PNG, WebP, DOCX, XLSX,
        ODT, ODS, CSV ou TXT; no máximo 20 MB. Guardado fora da pasta pública com nome gerado. O mesmo
        arquivo na mesma pasta do condomínio é recusado (409).
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [condominium_id, folder, file], properties: { condominium_id: { type: integer }, folder: { type: string, enum: [atas, contratos, plantas, notas_fiscais, outros] }, title: { type: string, maxLength: 160 }, file: { type: string, format: binary } } } } }
      responses:
        '201': { description: Arquivo enviado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Arquivo já está na pasta }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: 'Tipo, extensão, tamanho ou pasta inválidos' }
  /documents/{id}:
    get:
      operationId: showVirtualDiskFile
      summary: Dados do arquivo
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Arquivo }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteVirtualDiskFile
      summary: Exclusão lógica; o arquivo continua guardado (erp.documents.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Excluído }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /documents/{id}/download:
    get:
      operationId: downloadVirtualDiskFile
      summary: Baixa o arquivo como anexo (erp.documents.view, no escopo)
      description: 'Content-Disposition attachment, X-Content-Type-Options nosniff, CSP sandbox, Cache-Control no-store.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Conteúdo do arquivo, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /occurrences/{id}/ticket:
    post:
      operationId: openOccurrenceTicket
      summary: Abre o chamado da ocorrência na fila do Help Desk (erp.occurrences.manage)
      description: >-
        Origem erp, com condomínio, unidade, assunto, descrição e prioridade da ocorrência (baixa,
        média e alta viram low, medium e high). Uma ocorrência abre no máximo um chamado; o ticket_id
        fica gravado na ocorrência (só leitura no cadastro /occurrences).
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '201': { description: '{ data: { occurrence_id, ticket_id, protocol } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A ocorrência já tem chamado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: Chamado recusado pelo Help Desk (field e message) }
  /dashboard:
    get:
      operationId: operationalDashboard
      summary: Números e alertas reais da administradora no contexto (erp.access)
      description: >-
        cards: maintenances_late, maintenances_week, insurances_renewal (até 30 dias), insurances_expired,
        contracts_renewal, contracts_expired, reservations_pending, occurrences_open, deliveries_waiting,
        receivables_overdue_cents, receivables_week_cents, payables_week_cents, waitlist_to_call.
        alerts: [{kind, severity (danger, warning, info), count, message, route}] só com contagem maior que zero.
      security: [{ session: [] }]
      parameters: [{ name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }]
      responses:
        '200': { description: '{ data: { as_of, condominium_id, cards, alerts } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reservations/{id}/call-waitlist:
    post:
      operationId: callWaitlist
      summary: Chama o primeiro da lista de espera da data e da área de uma reserva cancelada (erp.reservations.manage)
      description: Só registra a chamada (quem, quando, para qual reserva); a reserva nova é feita por quem foi chamado, pelas regras da área.
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { reservation_id, waitlist_id, resident_name, unit_id, called_at } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Reserva não cancelada, data já reservada de novo ou ninguém aguardando' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /maintenances/{id}/next:
    post:
      operationId: nextMaintenance
      summary: Gera a próxima manutenção de uma concluída pela periodicidade, uma vez só (erp.maintenances.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '201': { description: '{ data: { id, previous_id, planned_on, service, status } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Não concluída ou a próxima já foi gerada' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { description: Manutenção única (sem periodicidade) }
  /panels/condominium/{id}:
    get:
      operationId: condominiumPanel
      summary: Painel do condomínio (AP-002) (erp.access e erp.units.view)
      description: >-
        occupancy (unidades, ocupadas por morador ativo, vagas, taxa); finance (saldo das contas
        bancárias, inadimplência com encargos e faixas, fechamento e resultado da competência atual);
        operations (os cards e alertas do /dashboard para o condomínio).
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { condominium, as_of, occupancy, finance, operations } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /panels/unit/{id}:
    get:
      operationId: unitPanel
      summary: Painel da unidade (AP-003) (erp.access e erp.units.view)
      description: >-
        unit; people (moradores e proprietários ativos); finance (vencidas com encargos, a vencer, acordos
        ativos ou quebrados); documents (últimos 10 emitidos); operations (entregas aguardando, reservas
        futuras, ocorrências abertas, veículos e animais).
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { unit, as_of, people, finance, documents, operations } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications:
    get:
      operationId: listNotifications
      summary: Avisos da fila do ERP (erp.notifications.view)
      description: >-
        Modo de entrega (delivery_mode): log (nada enviado), sandbox (só para a caixa de teste
        ERP_MAIL_SANDBOX_TO) ou production (só com APP_ENV=production e ERP_MAIL_DELIVERY=production).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending, processing, sent, failed, cancelled] } }
      responses:
        '200': { description: '{ data: [{ id, event_type, status, delivery_mode, recipients_count, attempts, available_at, processed_at, last_error }], total } (até 200)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/dispatch:
    post:
      operationId: dispatchNotifications
      summary: Processa a fila agora, até 50 avisos (erp.notifications.manage)
      security: [{ session: [], csrf: [] }]
      responses:
        '200': { description: '{ data: { mode, processed, sent, failed, retry, cancelled } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
  /notifications/{id}:
    get:
      operationId: showNotification
      summary: Aviso com a trilha de entrega (e-mail mascarado; endereço efetivo no sandbox)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Aviso com deliveries[] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/{id}/retry:
    post:
      operationId: retryNotification
      summary: Reenvia aviso com falha ou cancelado (erp.notifications.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Aviso de volta à fila }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Aviso não está com falha nem cancelado }
        '419': { $ref: '#/components/responses/CsrfInvalid' }

  /entries/{id}/discount:
    post:
      operationId: discountEntry
      summary: Desconto numa conta a receber em aberto (AP-026, erp.entries.manage)
      description: >-
        Reduz o valor com trilha (antes, depois, motivo). O desconto é menor que o valor (para perdoar,
        cancele o lançamento). Recusa conta paga, cancelada, parcela ou original de acordo, boleto ativo e
        competência fechada (ADR 0031).
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount_cents, reason], properties: { amount_cents: { type: string, example: '50,00' }, reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: '{ data: { entry_id, adjustment_id, before_cents, discount_cents, after_cents, adjustments[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Conta paga, de acordo, com boleto ativo ou competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /entries/{id}/adjustments:
    get:
      operationId: listEntryAdjustments
      summary: Trilha dos descontos de uma conta (erp.entries.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: [{ id, kind, amount_cents, before_cents, after_cents, reason, created_by, created_at }] }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /extra-charges:
    get:
      operationId: listExtraCharges
      summary: Multas avulsas e cobranças extras (AP-027/028, erp.invoices.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: kind, in: query, schema: { type: string, enum: [extra, fine] } }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }
      responses:
        '200': { description: '{ data[], total }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createExtraCharge
      summary: Gera multa avulsa (uma unidade, com motivo) ou cobrança extra (uma ou mais unidades) (erp.invoices.manage)
      description: >-
        Uma conta a receber por unidade, travada no cadastro (altere ou cancele pela origem). method fixed =
        valor por unidade; equal = total dividido igual; fraction = total pela fração ideal. Multa é sempre
        fixed. Vencimento não pode ser no passado; competência fechada recusa.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, kind, description, chart_account_id, competence, due_on, amount_cents, unit_ids], properties: { condominium_id: { type: integer }, kind: { type: string, enum: [extra, fine] }, description: { type: string, minLength: 3, maxLength: 120 }, chart_account_id: { type: integer, description: 'Conta analítica de receita' }, competence: { type: string, example: '2026-11' }, due_on: { type: string, format: date }, method: { type: string, enum: [fixed, equal, fraction] }, amount_cents: { type: string, example: '120,00' }, unit_ids: { type: array, items: { type: integer } }, related_entry_id: { type: integer, description: 'Multa: conta a que se refere' }, reason: { type: string, description: 'Multa: obrigatório' } } } } }
      responses:
        '201': { description: Cobrança com as contas geradas }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /extra-charges/{id}:
    get:
      operationId: getExtraCharge
      summary: Multa ou cobrança extra com as contas geradas (erp.invoices.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: '{ data: { ..., entries[{ entry_id, unit_label, amount_cents, status, paid_on }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /extra-charges/{id}/cancel:
    post:
      operationId: cancelExtraCharge
      summary: Cancela a multa ou cobrança extra e as contas geradas (erp.invoices.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Conta paga, em acordo, com boleto ativo ou competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bank-transfers:
    get:
      operationId: listBankTransfers
      summary: Transferências entre contas bancárias (AP-029, erp.entries.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }
      responses:
        '200': { description: '{ data[], total }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createBankTransfer
      summary: Transfere saldo entre duas contas bancárias ativas do mesmo condomínio (erp.entries.manage)
      description: Não é receita nem despesa. Entra nos saldos das contas e na conciliação da prestação de contas. Data até hoje, competência aberta.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [condominium_id, from_bank_account_id, to_bank_account_id, amount_cents, transferred_on, description], properties: { condominium_id: { type: integer }, from_bank_account_id: { type: integer }, to_bank_account_id: { type: integer }, amount_cents: { type: string, example: '1.000,00' }, transferred_on: { type: string, format: date }, description: { type: string, minLength: 3, maxLength: 160 } } } } }
      responses:
        '201': { description: Transferência registrada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bank-transfers/{id}:
    get:
      operationId: getBankTransfer
      summary: Transferência entre contas (erp.entries.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Transferência }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bank-transfers/{id}/cancel:
    post:
      operationId: cancelBankTransfer
      summary: Cancela a transferência; sai dos saldos (erp.entries.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Cancelada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Já cancelada ou competência fechada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /imports:
    get:
      operationId: listImports
      summary: Importações do escopo (ADR 0058, erp.imports.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: kind, in: query, schema: { type: string, enum: [ofx, entries, unit_entries, payables, fractions, delinquents] } }
      responses:
        '200': { description: '{ data[], total }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/preview:
    post:
      operationId: previewImport
      summary: Envia o arquivo e devolve a prévia, linha a linha (erp.imports.manage e a permissão do destino)
      description: >-
        ofx (AP-140, extrato da conta bancária escolhida), entries (AP-144), unit_entries (AP-145),
        payables (AP-146), fractions (AP-143) e delinquents (AP-142); planilhas em CSV ou XLSX com
        cabeçalho. O arquivo inteiro é validado; nada é lançado. O arquivo fica em storage privado. O mesmo
        arquivo já aplicado no condomínio é recusado (409).
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [kind, condominium_id, file], properties: { kind: { type: string, enum: [ofx, entries, unit_entries, payables, fractions, delinquents] }, condominium_id: { type: integer }, bank_account_id: { type: integer, description: 'Obrigatório no OFX' }, file: { type: string, format: binary, description: 'Até 2 MB' } } } } }
      responses:
        '201': { description: '{ data: { id, status: previewed, rows_count, error_count, summary, preview[{ line, status ok|error|already, errors[], data }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Arquivo já aplicado neste condomínio }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /imports/{id}:
    get:
      operationId: getImport
      summary: Importação; no OFX, com as linhas e a conciliação (erp.imports.view)
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Importação }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{id}/apply:
    post:
      operationId: applyImport
      summary: Aplica a prévia, relendo e revalidando o arquivo guardado; tudo numa transação (erp.imports.manage e a permissão do destino)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 'Aplicada: summary.applied com as contagens' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Já aplicada ou o arquivo tem linhas com erro (nada gravado) }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bank-statement-lines:
    get:
      operationId: listPendingStatementLines
      summary: Linhas do extrato pendentes de conciliação (erp.imports.view)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
      responses:
        '200': { description: '{ data[{ id, fitid, kind, posted_on, amount_cents, memo, status, bank_account }], total }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bank-statement-lines/{id}/resolve:
    post:
      operationId: resolveStatementLine
      summary: Concilia à mão com um lançamento pago da mesma conta e valor, ou ignora, com nota (erp.imports.manage e erp.entries.manage)
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [action, note], properties: { action: { type: string, enum: [match, ignore] }, entry_id: { type: integer }, note: { type: string, minLength: 5, maxLength: 255 } } } } }
      responses:
        '200': { description: Linha resolvida }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Linha já resolvida }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /inspection-templates:
    get:
      operationId: listInspectionTemplates
      tags: [Inspections]
      summary: Modelos de checklist ativos
      description: Requer erp.inspections.view.
      security: [{ session: [] }]
      responses:
        '200': { description: Modelos }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inspections:
    get:
      operationId: listInspections
      tags: [Inspections]
      summary: Vistorias recentes dos condomínios do usuário
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [in_progress, completed, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Lista }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: startInspection
      tags: [Inspections]
      summary: Check-in (abre a vistoria)
      description: Requer erp.inspections.perform e o condomínio no escopo. Fora do raio ou sem posição exige checkin_note.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominium_id, template_id]
              properties:
                condominium_id: { type: integer }
                template_id: { type: integer }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: number, description: Precisão do GPS em metros }
                checkin_note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Vistoria criada
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Inspection' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { description: CSRF inválido }
        '422':
          description: Dados inválidos ou justificativa ausente
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  /inspections/schedule:
    get:
      operationId: inspectionSchedule
      tags: [Inspections]
      summary: Planos ativos com próxima data e situação (overdue, due_soon, in_progress, ok)
      security: [{ session: [] }]
      responses:
        '200': { description: Programação }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inspections/{id}:
    get:
      operationId: getInspection
      tags: [Inspections]
      summary: Uma vistoria com itens e fotos
      description: Fora do escopo responde 404.
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Vistoria
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Inspection' } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada ou fora do escopo }
  /inspections/{id}/items/{item}:
    put:
      operationId: answerInspectionItem
      tags: [Inspections]
      summary: Responde um item (issue exige note)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [pending, ok, issue, not_applicable] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Vistoria atualizada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada }
        '409': { description: Vistoria concluída ou cancelada }
        '422': { description: Inválido, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /inspections/{id}/items/{item}/photos:
    post:
      operationId: addInspectionPhoto
      tags: [Inspections]
      summary: Envia uma foto do item (JPG, PNG ou WebP até 15 MB; regravada como JPEG sem EXIF)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: item, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '201': { description: Foto gravada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada }
        '409': { description: Vistoria concluída ou cancelada }
        '422': { description: Arquivo inválido ou limite de fotos }
  /inspections/{id}/complete:
    post:
      operationId: completeInspection
      tags: [Inspections]
      summary: Conclui a vistoria (todos os itens respondidos e fotos obrigatórias presentes)
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { summary: { type: string, maxLength: 4000 } } }
      responses:
        '200': { description: Concluída }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Não encontrada }
        '409': { description: Já concluída ou cancelada }
        '422': { description: Itens pendentes, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /tickets:
    get:
      operationId: listTickets
      tags: [Tickets]
      summary: Chamados dos condomínios do usuário e os que ele abriu (ADR 0034)
      description: Requer erp.access. Mesma regra da tela /operacional/chamados.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, waiting_customer, resolved, closed] } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Protocolo ou assunto }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Ticket' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: openTicket
      tags: [Tickets]
      summary: Abre um chamado na fila do Help Desk (origem api)
      description: Requer erp.access e, quando informado, o condomínio no escopo. A unidade precisa ser do condomínio. Sem requester_name o solicitante é o próprio usuário.
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, minLength: 4, maxLength: 180 }
                message: { type: string, minLength: 10 }
                area: { type: string, enum: [general, technical, financial], default: general }
                priority: { type: string, enum: [low, medium, high, urgent], default: medium }
                category: { type: string, maxLength: 100 }
                condominium_id: { type: integer }
                unit_id: { type: integer }
                requester_name: { type: string, maxLength: 160 }
                requester_email: { type: string, format: email, maxLength: 190 }
                requester_phone: { type: string, maxLength: 30 }
      responses:
        '201': { description: Chamado aberto, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Ticket' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { description: CSRF inválido }
        '422': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
  /tickets/{id}:
    get:
      operationId: showTicket
      tags: [Tickets]
      summary: Um chamado visível para o usuário
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Chamado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Ticket' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Não encontrado ou fora do escopo }
