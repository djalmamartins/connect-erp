      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 12, default: 6 } }
      responses:
        '200': { description: '{ data: { condominium_id, as_of, opening_cash_cents, overdue_receivables_cents, overdue_payables_cents, months[{competence, from, to, receivables_cents, payables_cents, recurring_in_cents, recurring_out_cents, opening_cents, in_cents, out_cents, net_cents, closing_cents}], lowest{competence, closing_cents}, warnings[{code, message, competence}] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/expense-review:
    get:
      operationId: expenseReview
      summary: Conferência de despesas para o conselho fiscal (erp.entries.view, ADR 0188)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200': { description: 'Conferências das despesas' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/supplier-spend:
    get:
      operationId: supplierSpend
      summary: Gastos por fornecedor, com concentração e comparação com o período anterior (erp.entries.view, ADR 0190)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: '{ data: { from, to, previous_from, previous_to, expenses_cents, identified_cents, suppliers, truncated, rows[{ supplier_id, name, document_masked, entries, total_cents, paid_cents, open_cents, share_percent, top_accounts[], first_competence, last_competence, months_active, previous_cents, variation_percent }], without_supplier, concentration{ top1_percent, top5_percent, hhi }, previous_only_suppliers, warnings[] } } ou CSV' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: Limite de exportações por hora }
  /reports/billing-check:
    get:
      operationId: billingCheck
      summary: Conferência do faturamento da competência por unidade, sem cobrança, duplicada, variação, unidade inativa e receita sem unidade (erp.entries.view, ADR 0198)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: competence, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: tolerance, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        '200': { description: '{ data: { competence, previous_competence, tolerance_percent, active_units, billed_units, total_cents, previous_total_cents, without_unit_cents, summary, missing, duplicates, variations, inactive_units, without_unit (cada um { total, truncated, items[] }), warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/collection-progress:
    get:
      operationId: collectionProgress
      summary: Acompanhamento da arrecadação da competência, com cobrado, recebido, vencido, faixas de pagamento em relação ao vencimento, mês anterior e tendência de 6 meses (erp.entries.view, ADR 0199)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: competence, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: as_of, in: query, schema: { type: string, format: date, description: 'Data de referência (padrão hoje)' } }
      responses:
        '200': { description: '{ data: { competence, as_of, previous_competence, billed_cents, billed_count, received_cents, open_cents, overdue_cents, received_percent, on_time_percent, buckets{ on_time, late_1_5, late_6_15, late_16_30, late_31_60, late_over_60, open: { cents, count, percent } }, previous, on_time_delta_points, trend[{ competence, billed_cents, on_time_percent, received_percent }], warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/supplier-health:
    get:
      operationId: supplierHealth
      summary: Conferência do cadastro de fornecedores, com documento inválido, nome repetido, inativo com conta em aberto, sem dados de pagamento e sem uso em 24 meses (erp.suppliers.view e erp.entries.view, ADR 0200)
      security: [{ session: [] }]
      responses:
        '200': { description: '{ data: { as_of, global_scope, condominiums, suppliers, active_suppliers, summary, invalid_document, similar_names, inactive_in_use, no_payment_data, dormant (null sem acesso a todos os condomínios) (cada um { total, truncated, items[] }), warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/expense-benchmark:
    get:
      operationId: expenseBenchmark
      summary: Comparativo de despesas entre os condomínios do escopo, por unidade por mês em cada conta do plano padrão, com mediana e outliers (erp.entries.view, ADR 0201)
      description: >-
        Só contas analíticas do plano padrão. Por unidade por mês = total ÷ unidades ativas ÷ meses do condomínio com despesa na faixa.
        Condomínio com menos de 3 meses aparece marcado (short_history) e fica fora da mediana; outlier só com 3 ou mais comparáveis.
        Só nomes de condomínio e valores.
      security: [{ session: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, example: '2026-01' } }
        - { name: to, in: query, required: true, schema: { type: string, example: '2026-12' }, description: 'No máximo 12 competências' }
        - { name: tolerance, in: query, schema: { type: integer, minimum: 10, maximum: 500, default: 50 }, description: 'Percentual acima da mediana para outlier' }
      responses:
        '200': { description: '{ data: { from, to, tolerance_percent, condominiums[{condominium_id, name, units, months, short_history}], accounts[{chart_account_id, code, name, median_per_unit_month_cents, comparable_condominiums, items[]}], outliers[], warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/ledger:
    get:
      operationId: ledger
      summary: Livro Razão por conta do plano (erp.entries.view e erp.chart.view, ADR 0165)
      description: >-
        Saldo anterior, débitos, créditos e saldo final de cada conta, com os lançamentos do período.
        account_code filtra a conta e as subcontas. truncated = true quando passa de 5000 linhas.
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: basis, in: query, schema: { type: string, enum: [competence, cash], default: competence } }
        - { name: account_code, in: query, schema: { type: string, example: '2.01' } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: '{ data: { accounts[{code, name, nature, opening_cents, debit_cents, credit_cents, closing_cents, lines[]}], truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: Limite de exportações por hora }
  /reports/account-balances:
    get:
      operationId: accountBalances
      summary: Saldos das contas bancárias numa data ou num período (erp.entries.view e erp.chart.view, ADR 0165)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: 'Saldo no fim do dia; sem ele, use from e to' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: '{ data: { accounts[{bank_account_id, condominium_id, condominium_name, name, opening_cents, received_cents, paid_cents, closing_cents}], totals } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: Limite de exportações por hora }
  /reports/income-statement:
    get:
      operationId: incomeStatement
      summary: Demonstração do Resultado (DRE) por conta do plano (erp.entries.view e erp.chart.view, ADR 0165)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: basis, in: query, schema: { type: string, enum: [competence, cash], default: competence } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: '{ data: { rows[{code, name, nature, level, analytic, amount_cents}], totals{revenue_cents, expense_cents, result_cents, margin_percent} } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: Limite de exportações por hora }
  /reports/accountability:
    get:
      operationId: accountability
      summary: Prestação de contas mensal de um condomínio (erp.entries.view e erp.chart.view, ADR 0166)
      description: >-
        Junta balancete, DRE por competência, saldos bancários por caixa, inadimplência (até 500 unidades),
        resumo e avisos (mês aberto, lançamentos em aberto, inadimplência).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, schema: { type: string, example: '2026-10' } }
      responses:
        '200': { description: '{ data: { closing, trial_balance, income_statement, bank_accounts, delinquency, summary, warnings[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /accountability-publications:
    get:
      operationId: accountabilityPublications
      summary: Versões publicadas da prestação de contas mensal ou anual (erp.closing.view, erp.entries.view e erp.chart.view, ADR 0179/0183)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [monthly, annual] } }
        - { name: month, in: query, schema: { type: string, example: '2026-10' } }
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: 'Usado com kind=annual' }
      responses:
        '200': { description: '{ data: { condominium_id, competence, truncated, rows[{ id, kind, competence, version, sha256, status, notes, published_by, published_at, withdrawn_* }] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: accountabilityPublish
      summary: Publica a prestação de contas de um mês fechado ou de um ano com todos os meses fechados (também erp.closing.manage, ADR 0179/0183)
      description: Conteúdo igual ao da versão atual não cria versão nova (200, created = false).
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominium_id]
              properties:
                condominium_id: { type: integer }
                kind: { type: string, enum: [monthly, annual], default: monthly }
                month: { type: string, example: '2026-10', description: 'Obrigatório no mensal' }
                year: { type: integer, minimum: 2000, maximum: 2100, description: 'Obrigatório quando kind=annual' }
                notes: { type: string, maxLength: 255 }
      responses:
        '200': { description: 'Mesmo conteúdo da versão atual: { data: { ..., created: false } }' }
        '201': { description: '{ data: { id, version, sha256, status, ..., created: true } }' }
        '400': { description: JSON inválido }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Mês aberto ou, no anual, algum mês do ano ainda aberto' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /accountability-publications/{id}:
    get:
      operationId: accountabilityPublication
      summary: Uma versão publicada com o pacote congelado; ?format=csv baixa o CSV (ADR 0179)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: '{ data: { id, kind, version, sha256, status, intact, payload } } ou text/csv (formato anual quando kind=annual)' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Mais de 30 exportações na última hora }
  /accountability-publications/{id}/withdraw:
    post:
      operationId: accountabilityWithdraw
      summary: Retira a versão atual com motivo; nada é apagado (erp.closing.manage, ADR 0179)
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: '{ data: { id, status: withdrawn, withdraw_reason, withdrawn_at } }' }
        '400': { description: JSON inválido }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A versão não é a atual }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/deliveries:
    get:
      operationId: deliveriesReport
      summary: Registros de entregas da portaria (erp.deliveries.view, ADR 0166)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer }, description: 'Vazio = todos os condomínios do escopo' }
        - { name: status, in: query, schema: { type: string, enum: [active, picked_up, inactive] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Junto com from, no máximo 366 dias' }
        - { name: unit_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { rows[], summary{waiting, picked_up, cancelled, average_pickup_days, oldest_waiting_days}, truncated } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /delivery-pickups:
    post:
      operationId: deliveryPickUp
      summary: Dá baixa na retirada de uma entrega (erp.deliveries.manage, ADR 0166)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_id, picked_up_by]
              properties:
                delivery_id: { type: integer }
                picked_up_by: { type: string, minLength: 2, maxLength: 160 }
                picked_up_on: { type: string, format: date }
      responses:
        '200': { description: '{ data: { id, condominium_id, status, picked_up_on, picked_up_by } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Entrega já retirada ou cancelada }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /chart-account-openings:
    get:
      operationId: chartAccountOpenings
      summary: Saldo inicial do plano de contas de um condomínio (erp.settings.view, ADR 0166)
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: '{ data: { condominium_id, rows[{code, name, nature, level, analytic, chart_account_id, opened_on, notes, amount_cents}], totals } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: setChartAccountOpening
      summary: Grava o saldo inicial de uma conta analítica (erp.settings.manage, ADR 0166)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condominium_id, chart_account_id, opened_on, amount_cents]
              properties:
                condominium_id: { type: integer }
                chart_account_id: { type: integer }
                opened_on: { type: string, format: date }
                amount_cents: { oneOf: [{ type: integer }, { type: string, example: '-10,00' }] }
                notes: { type: string, maxLength: 255 }
      responses:
        '200': { description: 'O mesmo formato do GET' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfInvalid' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/balance-sheet:
    get:
      operationId: balanceSheet
      summary: Balanço Patrimonial de um condomínio numa data (erp.entries.view e erp.chart.view, ADR 0167)
      description: >-
        Ativo (bancos e contas a receber), passivo (contas a pagar e fundos do saldo inicial) e patrimônio
        líquido (resultados acumulados e do exercício). Quando não fecha, balanced = false e a diferença vem
        exposta, com avisos e limitações. format=csv baixa o CSV (30 por hora).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date }, description: 'Sem ela, vale hoje' }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: '{ data: { date, year_start, assets, liabilities, equity, totals, balanced, warnings[], limitations[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { description: Limite de exportações por hora }
  /reports/cash-book:
    get:
      operationId: cashBook
      summary: Livro caixa mensal de um condomínio (erp.entries.view, CN-007, ADR 0174)
      description: >-
        Regime de caixa: saldo anterior (soma das contas bancárias no dia 1), cada lançamento válido pago no mês com
        o saldo corrido, os anexos numerados A1, A2... (sem o caminho do arquivo), o resumo por conta, as contas
        bancárias, as despesas pagas sem nota/comprovante/recibo e a conferência com os bancos (reconciled e
        difference_cents). closed diz se a competência está fechada (senão é prévia). O PDF e o pacote ZIP com os
        anexos saem da tela do ERP (/prestacao-de-contas/livro-caixa).
      security: [{ session: [] }]
      parameters:
        - { name: condominium_id, in: query, required: true, schema: { type: integer } }
        - { name: competence, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' } }
      responses:
        '200': { description: '{ data: { condominium, competence, from, to, closed, opening_cents, in_cents, out_cents, closing_cents, banks_closing_cents, difference_cents, reconciled, lines[{seq, entry_id, paid_on, nature, description, document_number, account_code, account_name, counterpart, bank_name, in_cents, out_cents, balance_cents, annex_refs[]}], annexes[{ref, number, line, id, entry_id, kind, kind_label, original_name, mime, size_bytes}], missing_proof[], accounts[], banks[] } }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
