# Gerado por tools/registry-openapi.php a partir de Definitions.php. Não editar à mão.
openapi: 3.1.0
info:
  title: Connect ERP API — Cadastros
  version: 0.3.0
  description: |
    Cadastros do ERP (ADR 0014). Mesma autenticação de openapi.yaml: sessão do Organic Code,
    X-CSRF-Token em POST/PUT/PATCH/DELETE. Permissões erp.<cadastro>.view (leitura) e
    erp.<cadastro>.manage (escrita). Registros fora do escopo de condomínios respondem 404.
    Listagens paginadas no servidor (25 por página). Exclusão lógica.
servers:
  - url: /api/v1
security:
  - session: []
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: PHPSESSID }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthenticated, forbidden, not_found, csrf_invalid, invalid_json, validation_failed] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string }, description: Mensagem por campo (422) }
    Meta:
      type: object
      properties: { total: { type: integer }, page: { type: integer }, per_page: { type: integer }, pages: { type: integer } }
    UnitsInput:
      type: object
      required: [condominium_id, number, type]
      properties:
        condominium_id: { type: [integer, "null"], minimum: 1 }
        block: { type: [string, "null"], maxLength: 20 }
        number: { type: [string, "null"], maxLength: 16 }
        type: { type: [string, "null"], enum: ['apartamento', 'casa', 'sala', 'loja', 'garagem', 'outro'] }
        floor: { type: [string, "null"], maxLength: 10 }
        ideal_fraction: { type: [number, "null"], minimum: 0, maximum: 1 }
        private_area: { type: [number, "null"], minimum: 0, maximum: 99999999.99 }
        notes: { type: [string, "null"], maxLength: 2000 }
        status: { type: string, enum: [active, inactive], default: active }
    Units:
      allOf:
        - $ref: '#/components/schemas/UnitsInput'
        - type: object
          properties:
            id: { type: integer }
            condominium_name: { type: [string, "null"] }
            label: { type: [string, "null"], readOnly: true }
            created_at: { type: string }
            updated_at: { type: string }
    ResidentsInput:
      type: object
      required: [condominium_id, relationship, name]
      properties:
        condominium_id: { type: [integer, "null"], minimum: 1 }
        unit_id: { type: [integer, "null"], minimum: 1, description: 'ID de /units do mesmo condomínio; preenche unit_label com o texto da unidade.' }
        unit_label: { type: [string, "null"], maxLength: 40 }
        relationship: { type: [string, "null"], enum: ['owner', 'tenant', 'resident', 'financial'] }
        name: { type: [string, "null"], maxLength: 160 }
        document: { type: [string, "null"], description: 'CPF ou CNPJ com DV válido; resposta só com dígitos.' }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        phone: { type: [string, "null"], description: 'DDD e número; resposta só com dígitos.' }
        starts_on: { type: [string, "null"], format: date }
        ends_on: { type: [string, "null"], format: date }
        billing_by_email: { type: boolean }
        notes: { type: [string, "null"], maxLength: 2000 }
        status: { type: string, enum: [active, inactive], default: active }
    Residents:
      allOf:
        - $ref: '#/components/schemas/ResidentsInput'
        - type: object
          properties:
            id: { type: integer }
            condominium_name: { type: [string, "null"] }
            created_at: { type: string }
            updated_at: { type: string }
    BoardMembersInput:
      type: object
      required: [condominium_id, role, name, term_starts_on, term_ends_on]
