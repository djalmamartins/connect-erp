        - type: object
          properties:
            id: { type: integer }
            condominium_name: { type: [string, "null"] }
            created_at: { type: string }
            updated_at: { type: string }
    SuppliersInput:
      type: object
      required: [legal_name, document, category]
      properties:
        legal_name: { type: [string, "null"], maxLength: 160 }
        document: { type: [string, "null"], description: 'CPF ou CNPJ com DV válido; resposta só com dígitos.' }
        trade_name: { type: [string, "null"], maxLength: 160 }
        category: { type: [string, "null"], enum: ['manutencao', 'limpeza', 'seguranca', 'elevadores', 'jardinagem', 'portaria', 'concessionaria', 'outros'] }
        email: { type: [string, "null"], format: email, maxLength: 254 }
