    Suppliers:
      allOf:
        - $ref: '#/components/schemas/SuppliersInput'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string }
            updated_at: { type: string }
    LawyersInput:
      type: object
      required: [name, oab]
      properties:
        name: { type: [string, "null"], maxLength: 160 }
        oab: { type: [string, "null"], examples: ["SP 123456"] }
        document: { type: [string, "null"], pattern: "^\\d{11}$", description: 'CPF com DV válido; resposta só com dígitos.' }
        firm: { type: [string, "null"], maxLength: 160 }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        phone: { type: [string, "null"], description: 'DDD e número; resposta só com dígitos.' }
        fee_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
        notes: { type: [string, "null"], maxLength: 2000 }
        status: { type: string, enum: [active, inactive], default: active }
    Lawyers:
      allOf:
        - $ref: '#/components/schemas/LawyersInput'
