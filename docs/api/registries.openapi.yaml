          properties:
            id: { type: integer }
            created_at: { type: string }
            updated_at: { type: string }
    VehiclesInput:
      type: object
      required: [condominium_id, plate, kind]
      properties:
        condominium_id: { type: [integer, "null"], minimum: 1 }
        unit_id: { type: [integer, "null"], minimum: 1, description: 'ID de /units do mesmo condomínio; preenche unit_label com o texto da unidade.' }
        unit_label: { type: [string, "null"], maxLength: 40 }
        plate: { type: [string, "null"], pattern: "^[A-Z]{3}\\d[A-Z0-9]\\d{2}$" }
        kind: { type: [string, "null"], enum: ['carro', 'moto', 'utilitario', 'outro'] }
        model: { type: [string, "null"], maxLength: 80 }
        color: { type: [string, "null"], maxLength: 30 }
