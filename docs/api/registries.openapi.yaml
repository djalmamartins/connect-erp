paths:
  /units:
    get:
      tags: ['Unidades']
      summary: 'Lista unidades (permissão erp.units.view)'
      parameters:
        - { name: condominium_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: type, in: query, description: 'Filtra por type', schema: { type: string, enum: ['apartamento', 'casa', 'sala', 'loja', 'garagem', 'outro'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Units' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { description: Sem sessão, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Sem permissão, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: ['Unidades']
      summary: 'Cadastra (permissão erp.units.manage)'
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitsInput' } } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Units' } } } } } }
        '400': { description: JSON inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Sem permissão, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '419': { description: CSRF inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /units/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: ['Unidades']
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Units' } } } } } }
        '404': { description: Inexistente ou fora do escopo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: ['Unidades']
      summary: 'Substitui todos os campos'
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitsInput' } } } }
      responses:
        '200': { description: Alterado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Units' } } } } } }
        '404': { description: Inexistente ou fora do escopo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: ['Unidades']
      summary: 'Mesmo comportamento do PUT (todos os campos)'
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitsInput' } } } }
      responses:
        '200': { description: Alterado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Units' } } } } } }
        '404': { description: Inexistente ou fora do escopo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: ['Unidades']
      summary: Exclusão lógica (o histórico de auditoria é mantido)
      security: [{ session: [], csrf: [] }]
      responses:
        '204': { description: Excluído }
        '409': { description: Em uso por cadastros ativos vinculados, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Inexistente ou fora do escopo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /residents:
