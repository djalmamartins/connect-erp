name: quality
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, simplexml, zip
          tools: composer:v2
      - name: Validate Composer when present
        run: if [ -f composer.json ]; then composer validate --strict; fi
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit tests without MariaDB
        run: composer test:unit:offline
      - name: Base de conhecimento cobre todas as páginas do menu (ADR 0141)
        run: php tools/help.php check --sem-prints
      - name: ERP render smoke without MariaDB
        run: php tests/erp/render-smoke.php
      - name: ERP render smoke on the ERP host
        run: SMOKE_HOST=erp.connect.lab php tests/erp/render-smoke.php
  # Integração num MariaDB de verdade (ADR 0369): o job acima roda só os testes de unidade sem banco.
  php-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MOVESOS_TEST_DB_HOST: 127.0.0.1
      MOVESOS_TEST_DB_PORT: 3306
      MOVESOS_TEST_DB_USER: root
      MOVESOS_TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, simplexml, zip
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit tests with MariaDB
        run: composer test:unit
      - name: Integration tests with MariaDB
        run: composer test:integration
