name: quality
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Validate Composer when present
        run: if [ -f composer.json ]; then composer validate --strict; fi
      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit tests without MariaDB
        run: composer test:unit:offline
      - name: Base de conhecimento cobre todas as páginas do menu (ADR 0141)
        run: php tools/help.php check --sem-prints
      - name: ERP render smoke without MariaDB
        run: php tests/erp/render-smoke.php
      - name: ERP render smoke on the ERP host
        run: SMOKE_HOST=erp.connect.lab php tests/erp/render-smoke.php
