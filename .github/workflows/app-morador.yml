name: app-morador
on:
  push:
    paths: ['apps/morador/**', '.github/workflows/app-morador.yml']
  pull_request:
    paths: ['apps/morador/**', '.github/workflows/app-morador.yml']
jobs:
  expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/morador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/morador/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Testes (Jest)
        run: npm test -- --ci
