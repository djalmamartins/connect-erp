<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>
    <DirectoryMatch "^/var/www/html/(source|service|tests|vendor|database|docs)(/|$)">
        Require all denied
    </DirectoryMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Link antigo do convite (/convite/{token}): o caminho leva o token e fica fora do log (ADR 0112).
    SetEnvIf Request_URI "^/convite/[0-9a-f]{64}" invite_token
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!invite_token
</VirtualHost>
